<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 7 QUIZ | DASSY DIGITAL LIBRARY</title>
    <style>
        :root {
            --dark-emerald: #06231a;
            --black-bg: #020d09;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --bright-gold: #ffcf40;
        }
        body { 
            background: var(--black-bg); 
            color: var(--light-gold); 
            font-family: 'Pyidaungsu', sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(6, 35, 26, 0.4); 
            border: 1px solid var(--gold); 
            border-radius: 12px; 
            padding: 22px; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(2, 13, 9, 0.9);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .phase-label { 
            font-size: 11px; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
            text-align: center;
        }
        .chapter-title {
            font-size: 14px;
            color: var(--bright-gold);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        h2 { 
            font-size: 14.5px; 
            line-height: 1.6; 
            margin: 15px 0; 
            color: #fff; 
            text-align: left; 
            font-weight: normal; 
        }
        
        .option { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            background: rgba(212, 175, 55, 0.04); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            color: #fff; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: left; 
            transition: 0.3s; 
            font-size: 13px; 
            line-height: 1.5;
            box-sizing: border-box;
        }
        .option:hover { 
            background: linear-gradient(45deg, #0a4030, var(--dark-emerald)); 
            border-color: var(--gold); 
            transform: translateX(5px); 
        }
        .option strong { color: var(--gold); }
        
        /* Result Box Styling */
        #result-box { 
            display: none; 
            margin-top: 15px; 
            padding: 20px; 
            border: 1px solid var(--gold); 
            background: rgba(6, 35, 26, 0.6); 
            border-radius: 8px; 
            animation: fadeInUp 0.5s ease-out; 
            border-left: 5px solid var(--gold);
        }
        .res-title { 
            font-size: 14.5px; 
            font-weight: bold; 
            color: var(--bright-gold); 
            margin-bottom: 12px; 
            display: block; 
            text-align: left;
            line-height: 1.5;
        }
        .res-desc { 
            color: #fff; 
            font-size: 13px; 
            line-height: 1.7; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        .next-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(45deg, #0a4030, var(--gold), #0a4030); 
            color: #fff; 
            border: 1px solid var(--gold); 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center; 
            text-transform: uppercase; 
            transition: 0.3s;
            letter-spacing: 1px; 
            font-size: 13px;
        }
        .next-btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 15px rgba(212,175,55,0.4); 
        }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <span class="phase-label">PAGE 55</span>
        <div class="chapter-title">Chapter 7 Quiz: Reclaiming the Upper Hand (Power Shift)<br>(အာဏာ ဒိုင်းနမစ် အထက်စီးသို့ ပြန်လည် ရောက်ရှိခြင်း)</div>
        
        <h2><strong>မေးခွန်း -</strong> တဖက်လူက သင့်ထံ ဆက်ဆံရေး ပြန်လည် စတင်ရန် သို့မဟုတ် လေးနက်စွာ စကားပြောရန် ချဉ်းကပ်လာချိန်တွင် မိမိ၏ အထက်စီး ရပ်တည်မှုကို မည်သို့ ထိန်းသိမ်းမည်နည်း။</h2>
        
        <div id="options-group">
            <button class="option" onclick="showAnalysis('(A) ကို ရွေးချယ်ပါက → Resentful Dominance (နာကျည်းချက်ဖြင့် စိုးမိုးမှု)', 'သုံးသပ်ချက်: အပြစ်တင်ခြင်းသည် အထက်စီး မဟုတ်ဘဲ အတိတ်၏ နာကျင်မှုတွင် ပိတ်မိနေသေးကြောင်း ဖော်ပြနေသည်။')">
                <strong>(A)</strong> ယခင် အမှားများကို ပြန်လည် တူးဖော်၍ အပြစ်တင် ဆုံးမမည်။
            </button>
            <button class="option" onclick="showAnalysis('(B) ကို ရွေးချယ်ပါက → Instant Reset (ချက်ချင်း တန်ဖိုး လျှော့ချမှု)', 'သုံးသပ်ချက်: စည်းမျဉ်း မရှိဘဲ ခွင့်လွှတ်ခြင်းသည် ရရှိထားသော Sovereignty ကို ပြန်လည် စွန့်လွှတ်လိုက်ခြင်း ဖြစ်သည်။')">
                <strong>(B)</strong> အစစအရာရာကို ချက်ချင်း ခွင့်လွှတ်ပြီး ယခင်အတိုင်း ပြန်လည် ပတ်သက်မည်။
            </button>
            <button class="option" onclick="showAnalysis('(C) ကို ရွေးချယ်ပါက → Indecisive Playing (မပြတ်သားသော ကစားမှု)', 'သုံးသပ်ချက်: ဝေဝေဝါဝါ လုပ်ခြင်းသည် ရေရှည်တွင် အဓိပတိ အရှိန်အဝါထက် ကလေးဆန်သော ပြုမူမှုအဖြစ် ပြောင်းလဲသွားနိုင်သည်။')">
                <strong>(C)</strong> လာရောက် ချဉ်းကပ်မှုကို သဘောကျသော်လည်း ချက်ချင်း ဆုံးဖြတ်ချက် မပေးဘဲ ဝေဝေဝါဝါ လုပ်ထားမည်။
            </button>
            <button class="option" onclick="showAnalysis('(D) ကို ရွေးချယ်ပါက → Sovereign Reversal (အဓိပတိ အထက်စီး ပြန်လည် ရရှိမှု)', 'သုံးသပ်ချက်: စည်းမျဉ်းများနှင့် ကိုယ်ပိုင် ဘဝကို ဦးစားပေး ဆုံးဖြတ်ခြင်းသည် ဆက်ဆံရေး ဒိုင်းနမစ်တွင် သင့်အား ထာဝရ အထက်စီး၌ ရပ်တည်စေသည်။')">
                <strong>(D)</strong> တည်ငြိမ်စွာ နားထောင်ပြီး မိမိ၏ စည်းမျဉ်းများနှင့် ကိုယ်ပိုင် တန်ဖိုးကို ဦးစားပေးကာ အထက်တန်းကျစွာ ဆုံးဖြတ်မည်။
            </button>
        </div>
    </div>

    <!-- RESULT EXPANSION SCREEN -->
    <div id="result-box">
        <span class="res-title" id="res-title"></span>
        <p class="res-desc" id="res-desc"></p>
        
        <button onclick="completeQuiz()" class="next-btn">CONTINUE TO NEXT PAGE →</button>
    </div>
</div>

<script>
    function showAnalysis(title, desc) {
        document.getElementById('options-group').style.display = 'none';
        document.getElementById('res-title').innerText = title;
        document.getElementById('res-desc').innerText = desc;
        document.getElementById('result-box').style.display = 'block';
    }

    function completeQuiz() {
        window.parent.postMessage("quizCompleted", "*");
    }
</script>

</body>
</html>
