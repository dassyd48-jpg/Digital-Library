<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 5 QUIZ | DASSY DIGITAL LIBRARY</title>
    <style>
        :root {
            --dark-emerald: #06231a;
            --black-bg: #020d09;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --bright-gold: #ffcf40;
        }
        body { 
            background: var(--black-bg); 
            color: var(--light-gold); 
            font-family: 'Pyidaungsu', sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(6, 35, 26, 0.4); 
            border: 1px solid var(--gold); 
            border-radius: 12px; 
            padding: 22px; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(2, 13, 9, 0.9);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .phase-label { 
            font-size: 11px; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
            text-align: center;
        }
        .chapter-title {
            font-size: 14px;
            color: var(--bright-gold);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        h2 { 
            font-size: 14.5px; 
            line-height: 1.6; 
            margin: 15px 0; 
            color: #fff; 
            text-align: left; 
            font-weight: normal; 
        }
        
        .option { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            background: rgba(212, 175, 55, 0.04); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            color: #fff; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: left; 
            transition: 0.3s; 
            font-size: 13px; 
            line-height: 1.5;
            box-sizing: border-box;
        }
        .option:hover { 
            background: linear-gradient(45deg, #0a4030, var(--dark-emerald)); 
            border-color: var(--gold); 
            transform: translateX(5px); 
        }
        .option strong { color: var(--gold); }
        
        /* Result Box Styling */
        #result-box { 
            display: none; 
            margin-top: 15px; 
            padding: 20px; 
            border: 1px solid var(--gold); 
            background: rgba(6, 35, 26, 0.6); 
            border-radius: 8px; 
            animation: fadeInUp 0.5s ease-out; 
            border-left: 5px solid var(--gold);
        }
        .res-title { 
            font-size: 14.5px; 
            font-weight: bold; 
            color: var(--bright-gold); 
            margin-bottom: 12px; 
            display: block; 
            text-align: left;
            line-height: 1.5;
        }
        .res-desc { 
            color: #fff; 
            font-size: 13px; 
            line-height: 1.7; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        .next-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(45deg, #0a4030, var(--gold), #0a4030); 
            color: #fff; 
            border: 1px solid var(--gold); 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center; 
            text-transform: uppercase; 
            transition: 0.3s;
            letter-spacing: 1px; 
            font-size: 13px;
        }
        .next-btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 15px rgba(212,175,55,0.4); 
        }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <span class="phase-label">PAGE 39</span>
        <div class="chapter-title">Chapter 5 Quiz: Sovereign Presence &amp; Body Language<br>(အဓိပတိ အရှိန်အဝါနှင့် ကိုယ်ဟန်မူရာ)</div>
        
        <h2><strong>မေးခွန်း -</strong> အပြင်တွင် မထင်မှတ်ဘဲ တဖက်လူနှင့် မလွှဲမရှောင်သာ ပြန်လည် ဆုံတွေ့ရသည့် အခါမျိုးတွင် သင့်၏ ကိုယ်ဟန်မူရာကို မည်သို့ ထိန်းသိမ်းမည်နည်း။</h2>
        
        <div id="options-group">
            <button class="option" onclick="showAnalysis('(A) ကို ရွေးချယ်ပါက → High Vulnerability (အလွယ်တကူ တုန်လှုပ်မှု)', 'သုံးသပ်ချက်: အကြည့်ကို မထိန်းနိုင်ခြင်းသည် မိမိ စိတ်ဓာတ်ရေးရာ အောက်စီးသို့ ရောက်ရှိနေကြောင်း ကိုယ်ဟန်မူရာက ဖော်ပြနေသည်။')">
                <strong>(A)</strong> စိတ်လှုပ်ရှားမှုကို မထိန်းနိုင်ဘဲ တဖက်လူ၏ အကြည့်နှင့် အပြုအမူကို လိုက်လံ စောင့်ကြည့်နေမည်။
            </button>
            <button class="option" onclick="showAnalysis('(B) ကို ရွေးချယ်ပါက → Childish Avoidance (ကလေးဆန်သော ရှောင်လွှဲမှု)', 'သုံးသပ်ချက်: မသိကျိုးကျွံ ဟန်ဆောင်ခြင်းသည် တဖက်လူအား မိမိ စိတ်ထိခိုက်နေဆဲ ဖြစ်ကြောင်း သိရှိသွားစေသည်။')">
                <strong>(B)</strong> စိတ်ဆိုးနေကြောင်း ပြသရန် မျက်နှာလွှဲကာ မသိကျိုးကျွံ ဟန်ဆောင်မည်။
            </button>
            <button class="option" onclick="showAnalysis('(C) ကို ရွေးချယ်ပါက → Nervous Over-compensation (စိုးရိမ်စိတ်ကြောင့် စကားလွန်မှု)', 'သုံးသပ်ချက်: စကားများများ ပြောခြင်းသည် အတွင်းစိတ်ထဲ မတည်ငြိမ်မှုကို ဖုံးကွယ်ရန် ကြိုးစားနေခြင်းဖြစ်ကြောင်း ပေါ်လွင်စေသည်။')">
                <strong>(C)</strong> စိတ်ထဲတွင် တုန်လှုပ်နေသော်လည်း အဆင်ပြေချင်ဟန် ဆောင်၍ စကားများများ ပြောမည်။
            </button>
            <button class="option" onclick="showAnalysis('(D) ကို ရွေးချယ်ပါက → Sovereign Presence (အထက်တန်းကျသော အရှိန်အဝါ)', 'သုံးသပ်ချက်: တည်ငြိမ်အထက်တန်းကျသော အမူအရာသည် တဖက်လူအား သင့်ထံမှ မယိမ်းယိုင်သော အဓိပတိ အရှိန်အဝါကို တိုက်ရိုက် ခံစားရစေသည်။')">
                <strong>(D)</strong> လုံးဝ တည်ငြိမ်သော မျက်နှာထား၊ အမြင်အာရုံ ထိန်းချုပ်မှုနှင့် အထက်တန်းကျသော မိတ်ဆွေတစ်ဦးလို အေးဆေးစွာ ဆက်ဆံမည်။
            </button>
        </div>
    </div>

    <!-- RESULT EXPANSION SCREEN -->
    <div id="result-box">
        <span class="res-title" id="res-title"></span>
        <p class="res-desc" id="res-desc"></p>
        
        <button onclick="completeQuiz()" class="next-btn">CONTINUE TO NEXT PAGE →</button>
    </div>
</div>

<script>
    function showAnalysis(title, desc) {
        document.getElementById('options-group').style.display = 'none';
        document.getElementById('res-title').innerText = title;
        document.getElementById('res-desc').innerText = desc;
        document.getElementById('result-box').style.display = 'block';
    }

    function completeQuiz() {
        window.parent.postMessage("quizCompleted", "*");
    }
</script>

</body>
</html>
