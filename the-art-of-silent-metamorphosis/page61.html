<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 8 QUIZ | DASSY DIGITAL LIBRARY</title>
    <style>
        :root {
            --dark-emerald: #06231a;
            --black-bg: #020d09;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --bright-gold: #ffcf40;
        }
        body { 
            background: var(--black-bg); 
            color: var(--light-gold); 
            font-family: 'Pyidaungsu', sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(6, 35, 26, 0.4); 
            border: 1px solid var(--gold); 
            border-radius: 12px; 
            padding: 22px; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(2, 13, 9, 0.9);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .phase-label { 
            font-size: 11px; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
            text-align: center;
        }
        .chapter-title {
            font-size: 14px;
            color: var(--bright-gold);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        h2 { 
            font-size: 14.5px; 
            line-height: 1.6; 
            margin: 15px 0; 
            color: #fff; 
            text-align: left; 
            font-weight: normal; 
        }
        
        .option { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            background: rgba(212, 175, 55, 0.04); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            color: #fff; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: left; 
            transition: 0.3s; 
            font-size: 13px; 
            line-height: 1.5;
            box-sizing: border-box;
        }
        .option:hover { 
            background: linear-gradient(45deg, #0a4030, var(--dark-emerald)); 
            border-color: var(--gold); 
            transform: translateX(5px); 
        }
        .option strong { color: var(--gold); }
        
        /* Result Box Styling */
        #result-box { 
            display: none; 
            margin-top: 15px; 
            padding: 20px; 
            border: 1px solid var(--gold); 
            background: rgba(6, 35, 26, 0.6); 
            border-radius: 8px; 
            animation: fadeInUp 0.5s ease-out; 
            border-left: 5px solid var(--gold);
        }
        .res-title { 
            font-size: 14.5px; 
            font-weight: bold; 
            color: var(--bright-gold); 
            margin-bottom: 12px; 
            display: block; 
            text-align: left;
            line-height: 1.5;
        }
        .res-desc { 
            color: #fff; 
            font-size: 13px; 
            line-height: 1.7; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        .next-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(45deg, #0a4030, var(--gold), #0a4030); 
            color: #fff; 
            border: 1px solid var(--gold); 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center; 
            text-transform: uppercase; 
            transition: 0.3s;
            letter-spacing: 1px; 
            font-size: 13px;
        }
        .next-btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 15px rgba(212,175,55,0.4); 
        }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <span class="phase-label">PAGE 61</span>
        <div class="chapter-title">Chapter 8 Quiz: Long-Term Sovereign Dominance<br>(ရေရှည် အဓိပတိ အရှိန်အဝါ ထိန်းသိမ်းခြင်း)</div>
        
        <h2><strong>မေးခွန်း -</strong> ဆက်ဆံရေးတွင် သို့မဟုတ် မိမိ ဘဝတွင် မိမိကိုယ်ကို လုံးဝ စိုးမိုးအုပ်ချုပ်နိုင်မှုကို ရရှိပြီးနောက် ထို အရှိန်အဝါကို ရေရှည် မည်သို့ ထိန်းသိမ်းမည်နည်း။</h2>
        
        <div id="options-group">
            <button class="option" onclick="showAnalysis('(A) ကို ရွေးချယ်ပါက → Relapse Risk (ပြန်လည် လျှော့ပါးသွားနိုင်ခြေ)', 'သုံးသပ်ချက်: စည်းကမ်း လျှော့ချလိုက်ပါက အဟောင်း ပုံစံသို့ ပြန်လည် ရောက်ရှိသွားနိုင်သည်။')">
                <strong>(A)</strong> အနိုင်ရရှိသွားပြီဖြစ်၍ စိတ္တဗေဒ စည်းကမ်းများကို လျှော့ချလိုက်မည်။
            </button>
            <button class="option" onclick="showAnalysis('(B) ကို ရွေးချယ်ပါက → Toxic Control (အဆိပ်အတောက် စိုးမိုးမှု)', 'သုံးသပ်ချက်: ဖိနှိပ်ခြင်းသည် မိမိကိုယ်ကို လုံးဝ စိုးမိုးအုပ်ချုပ်နိုင်သော အဆင့် မဟုတ်ဘဲ စိတ္တဗေဒဆိုင်ရာ အဆိပ်အတောက် ဆက်ဆံရေး ပုံစံကိုသာ ဖန်တီးပေးသည်။')">
                <strong>(B)</strong> တဖက်လူအား အမြဲတမ်း အောက်စီးတွင် ရှိနေစေရန် ချုပ်ချယ်ထားမည်။
            </button>
            <button class="option" onclick="showAnalysis('(C) ကို ရွေးချယ်ပါက → Anxiety Trapped (စိုးရိမ်စိတ်တွင် ပိတ်မိမှု)', 'သုံးသပ်ချက်: စိုးရိမ်နေခြင်းသည် အတွင်းစိတ်ထဲ တည်ငြိမ်မှု မရှိသေးကြောင်း ပြသနေသည်။')">
                <strong>(C)</strong> မိမိ၏ အရှိန်အဝါ ပျောက်ကွယ်သွားမည်ကို အမြဲ စိုးရိမ်နေမည်။
            </button>
            <button class="option" onclick="showAnalysis('(D) ကို ရွေးချယ်ပါက → Absolute Sovereignty (ထာဝရ  အရှိန်အဝါ)', 'သုံးသပ်ချက်: ကိုယ်ပိုင် တန်ဖိုးနှင့် ရည်မှန်းချက်များကို အစဉ်အမြဲ ဦးစားပေးခြင်းသည် သင့်အား မည်သည့် ဆက်ဆံရေးတွင်မဆို ထာဝရ ကိုယ်ပိုင် ဩဇာရှိသော ခေါင်းဆောင် အဖြစ် မယိမ်းယိုင်အောင် ရပ်တည်စေမည်။')">
                <strong>(D)</strong> တဖက်လူ၏ ပြုမူပုံအပေါ် မမူတည်ဘဲ မိမိ၏ ကိုယ်ပိုင် ရည်မှန်းချက်၊ တည်ငြိမ်မှုနှင့် စည်းမျဉ်းများကိုသာ အစဉ်အမြဲ ဦးစားပေးမည်။
            </button>
        </div>
    </div>

    <!-- RESULT EXPANSION SCREEN -->
    <div id="result-box">
        <span class="res-title" id="res-title"></span>
        <p class="res-desc" id="res-desc"></p>
        
        <button onclick="completeQuiz()" class="next-btn">CONTINUE TO NEXT PAGE →</button>
    </div>
</div>

<script>
    function showAnalysis(title, desc) {
        document.getElementById('options-group').style.display = 'none';
        document.getElementById('res-title').innerText = title;
        document.getElementById('res-desc').innerText = desc;
        document.getElementById('result-box').style.display = 'block';
    }

    function completeQuiz() {
        window.parent.postMessage("quizCompleted", "*");
    }
</script>

</body>
</html>
