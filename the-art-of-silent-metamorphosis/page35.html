<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 4 QUIZ | DASSY DIGITAL LIBRARY</title>
    <style>
        :root {
            --dark-emerald: #06231a;
            --black-bg: #020d09;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --bright-gold: #ffcf40;
        }
        body { 
            background: var(--black-bg); 
            color: var(--light-gold); 
            font-family: 'Pyidaungsu', sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(6, 35, 26, 0.4); 
            border: 1px solid var(--gold); 
            border-radius: 12px; 
            padding: 22px; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(2, 13, 9, 0.9);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .phase-label { 
            font-size: 11px; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
            text-align: center;
        }
        .chapter-title {
            font-size: 14px;
            color: var(--bright-gold);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        h2 { 
            font-size: 14.5px; 
            line-height: 1.6; 
            margin: 15px 0; 
            color: #fff; 
            text-align: left; 
            font-weight: normal; 
        }
        
        .option { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            background: rgba(212, 175, 55, 0.04); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            color: #fff; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: left; 
            transition: 0.3s; 
            font-size: 13px; 
            line-height: 1.5;
            box-sizing: border-box;
        }
        .option:hover { 
            background: linear-gradient(45deg, #0a4030, var(--dark-emerald)); 
            border-color: var(--gold); 
            transform: translateX(5px); 
        }
        .option strong { color: var(--gold); }
        
        /* Result Box Styling */
        #result-box { 
            display: none; 
            margin-top: 15px; 
            padding: 20px; 
            border: 1px solid var(--gold); 
            background: rgba(6, 35, 26, 0.6); 
            border-radius: 8px; 
            animation: fadeInUp 0.5s ease-out; 
            border-left: 5px solid var(--gold);
        }
        .res-title { 
            font-size: 14.5px; 
            font-weight: bold; 
            color: var(--bright-gold); 
            margin-bottom: 12px; 
            display: block; 
            text-align: left;
            line-height: 1.5;
        }
        .res-desc { 
            color: #fff; 
            font-size: 13px; 
            line-height: 1.7; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        .next-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(45deg, #0a4030, var(--gold), #0a4030); 
            color: #fff; 
            border: 1px solid var(--gold); 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center; 
            text-transform: uppercase; 
            transition: 0.3s;
            letter-spacing: 1px; 
            font-size: 13px;
        }
        .next-btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 15px rgba(212,175,55,0.4); 
        }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <span class="phase-label">PAGE 35</span>
        <div class="chapter-title">Chapter 4 Quiz: Creating the Psychological Void<br>(စိတ်ပိုင်းဆိုင်ရာ အမှောင်ထု ဖန်တီးခြင်း)</div>
        
        <h2><strong>မေးခွန်း -</strong> တဖက်လူက သင့်ထံမှ မည်သည့် သတင်းစကားမျှ မရရှိတော့ဘဲ သင့်၏ တိတ်ဆိတ်မှုကြောင့် စိတ္တဗေဒဆိုင်ရာ ဟာကွက် (Psychological Void) ဖြစ်ပေါ်နေချိန်တွင် မိမိဘက်မှ မည်သို့ ဆက်လက် ရပ်တည်မည်နည်း။</h2>
        
        <div id="options-group">
            <button class="option" onclick="showAnalysis('(A) ကို ရွေးချယ်ပါက → Void Destruction (ဟာကွက်ကို ဖျက်ဆီးခြင်း)', 'သုံးသပ်ချက်: သတင်းစကား ပြန်ပေးလိုက်ပါက တဖက်လူ စိတ်ထဲတွင် ဖြစ်ပေါ်ခါစ စူးစမ်းလိုစိတ်နှင့် စိုးရိမ်စိတ်တို့ ချက်ချင်း ပျောက်ကွယ်သွားမည်။')">
                <strong>(A)</strong> တဖက်လူ စိုးရိမ်နေမည်ကို စိုးရိမ်၍ မသိမသာ အရိပ်အမြွက် သတင်းစကား ပြန်ပေးမည်။
            </button>
            <button class="option" onclick="showAnalysis('(B) ကို ရွေးချယ်ပါက → Aggressive Presence (ကျနစွာ ဒေါသပြခြင်း)', 'သုံးသပ်ချက်: ပြင်းထန်သော စာတိုများသည် စိတ်ပိုင်းဆိုင်ရာအမှောင်ထု မဟုတ်ဘဲ မိမိ မကျေနပ်ဖြစ်နေကြောင်း ကြေညာလိုက်ခြင်း ဖြစ်သည်။')">
                <strong>(B)</strong> အပြတ်ဖြတ်ထားကြောင်း ပိုမို ပေါ်လွင်စေရန် ပြင်းထန်သော စာတိုများ တင်ပြမည်။
            </button>
            <button class="option" onclick="showAnalysis('(C) ကို ရွေးချယ်ပါက → Anxious Expectation (စိုးရိမ်စိတ်ဖြင့် စောင့်ဆိုင်းမှု)', 'သုံးသပ်ချက်: စောင့်ဆိုင်းနေသည့် စိတ်ဓာတ်သည် မိမိ၏ အရှိန်အဝါကို လျော့ပါးစေပြီး တဖက်လူထံ စိတ္တဗေဒဆိုင်ရာ ဖိအား မရောက်ရှိစေပေ။')">
                <strong>(C)</strong> တဖက်လူဘက်မှ စတင် ဆက်သွယ်လာချိန်ကို တောက်လျှောက် စောင့်ဆိုင်းနေမည်။
            </button>
            <button class="option" onclick="showAnalysis('(D) ကို ရွေးချယ်ပါက → Absolute Mystery (အပြည့်အဝ ပဟေဠိ အရှိန်အဝါ)', 'သုံးသပ်ချက်: တိတ်ဆိတ်မှုကို ဆက်လက် ထိန်းသိမ်းခြင်းသည် တဖက်လူ၏ စိတ်ထဲတွင် သင့်အား စွဲလမ်းစိတ်နှင့် နောင်တကို အမြင့်ဆုံးအထိ ဖန်တီးပေးမည်။')">
                <strong>(D)</strong> မည်သည့် လှုပ်ရှားမှုမျှ ထပ်မံ မပြဘဲ ပဟေဠိဆန်သော တိတ်ဆိတ်မှုကို အပြည့်အဝ ထိန်းသိမ်းထားမည်။
            </button>
        </div>
    </div>

    <!-- RESULT EXPANSION SCREEN -->
    <div id="result-box">
        <span class="res-title" id="res-title"></span>
        <p class="res-desc" id="res-desc"></p>
        
        <button onclick="completeQuiz()" class="next-btn">CONTINUE TO NEXT PAGE →</button>
    </div>
</div>

<script>
    function showAnalysis(title, desc) {
        document.getElementById('options-group').style.display = 'none';
        document.getElementById('res-title').innerText = title;
        document.getElementById('res-desc').innerText = desc;
        document.getElementById('result-box').style.display = 'block';
    }

    function completeQuiz() {
        window.parent.postMessage("quizCompleted", "*");
    }
</script>

</body>
</html>
