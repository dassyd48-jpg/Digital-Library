<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 3 QUIZ | DASSY DIGITAL LIBRARY</title>
    <style>
        :root {
            --dark-emerald: #06231a;
            --black-bg: #020d09;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --bright-gold: #ffcf40;
        }
        body { 
            background: var(--black-bg); 
            color: var(--light-gold); 
            font-family: 'Pyidaungsu', sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(6, 35, 26, 0.4); 
            border: 1px solid var(--gold); 
            border-radius: 12px; 
            padding: 22px; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(2, 13, 9, 0.9);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .phase-label { 
            font-size: 11px; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
            text-align: center;
        }
        .chapter-title {
            font-size: 14px;
            color: var(--bright-gold);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        h2 { 
            font-size: 14.5px; 
            line-height: 1.6; 
            margin: 15px 0; 
            color: #fff; 
            text-align: left; 
            font-weight: normal; 
        }
        
        .option { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            background: rgba(212, 175, 55, 0.04); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            color: #fff; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: left; 
            transition: 0.3s; 
            font-size: 13px; 
            line-height: 1.5;
            box-sizing: border-box;
        }
        .option:hover { 
            background: linear-gradient(45deg, #0a4030, var(--dark-emerald)); 
            border-color: var(--gold); 
            transform: translateX(5px); 
        }
        .option strong { color: var(--gold); }
        
        /* Result Box Styling */
        #result-box { 
            display: none; 
            margin-top: 15px; 
            padding: 20px; 
            border: 1px solid var(--gold); 
            background: rgba(6, 35, 26, 0.6); 
            border-radius: 8px; 
            animation: fadeInUp 0.5s ease-out; 
            border-left: 5px solid var(--gold);
        }
        .res-title { 
            font-size: 14.5px; 
            font-weight: bold; 
            color: var(--bright-gold); 
            margin-bottom: 12px; 
            display: block; 
            text-align: left;
            line-height: 1.5;
        }
        .res-desc { 
            color: #fff; 
            font-size: 13px; 
            line-height: 1.7; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        .next-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(45deg, #0a4030, var(--gold), #0a4030); 
            color: #fff; 
            border: 1px solid var(--gold); 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center; 
            text-transform: uppercase; 
            transition: 0.3s;
            letter-spacing: 1px; 
            font-size: 13px;
        }
        .next-btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 15px rgba(212,175,55,0.4); 
        }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <span class="phase-label">PAGE 28</span>
        <div class="chapter-title">Chapter 3 Quiz: Executing Absolute No-Contact<br>(သတင်းအချက်အလက် လုံးဝ အပြတ်ဖြတ်ခြင်း)</div>
        
        <h2><strong>မေးခွန်း -</strong> သတင်းအချက်အလက် လုံးဝ အပြတ်ဖြတ်ထားသည့် (No-Contact) ကာလအတွင်း မိမိ စိတ်ထဲ၌ တဖက်လူကို သတိရစိတ် သို့မဟုတ် လှုပ်ရှားမှုများကို ကြည့်ချင်စိတ် ပြင်းထန်လာပါက မည်သို့ တုံ့ပြန်မည်နည်း။</h2>
        
        <div id="options-group">
            <button class="option" onclick="showAnalysis('(A) ကို ရွေးချယ်ပါက → Boundary Breach (စည်းကမ်း ဖောက်ဖျက်မှု)', 'သုံးသပ်ချက်: ခိုးကြည့်ခြင်းသည် မိမိ၏ စိတ်ပိုင်းဆိုင်ရာ တည်ငြိမ်မှုကို ပြန်လည် ဖျက်ဆီးလိုက်ခြင်းဖြစ်ပြီး သတင်းအချက်အလက် လုံးဝ အပြတ်ဖြတ်ထားသည့် ၏ စိတ္တဗေဒဆိုင်ရာ ထိရောက်မှုကို လျှော့ကျစေသည်။')">
                <strong>(A)</strong> စိတ္တဗေဒ စည်းကမ်းကို ခဏလျှော့၍ တဖက်လူ၏ လှုပ်ရှားမှု သတင်းအစအနများကို ခဲ့ဘက် ကြည့်ရှုမည်။
            </button>
            <button class="option" onclick="showAnalysis('(B) ကို ရွေးချယ်ပါက → Power Surrender (စိတ္တဗေဒ အထက်စီး လက်လွှတ်မှု)', 'သုံးသပ်ချက်: စာတို စတင် ပို့လိုက်ခြင်းသည် တဖက်လူထံသို့ Power Balance (အာဏာမရှိမှု) ကို ပြန်လည် ရောက်ရှိသွားစေသည်။')">
                <strong>(B)</strong> တဖက်လူထံ စာတို အတိုလေး ပို့၍ မည်သို့ ရှိကြောင်း စမ်းသပ် မေးမြန်းမည်။
            </button>
            <button class="option" onclick="showAnalysis('(C) ကို ရွေးချယ်ပါက → Passive Suffering (ငြိမ်ခံ နာကျင်မှု)', 'သုံးသပ်ချက်: အပြုအမူကို ထိန်းနိုင်သော်လည်း စိတ်ကို မပြောင်းနိုင်ပါက ရေရှည်တွင် စိတ်ပိုင်းဆိုင်ရာ ပင်ပန်းနွမ်းနယ်မှုကို ဖြစ်ပေါ်စေသည်။')">
                <strong>(C)</strong> မကြည့်ဘဲ တောင့်ခံထားသော်လည်း အမှတ်တရများကို တွေးတော၍ ဝမ်းနည်းနေမည်။
            </button>
            <button class="option" onclick="showAnalysis('(D) ကို ရွေးချယ်ပါက → Sovereign Mastery (အဓိပတိ စိတ္တဗေဒ ထိန်းချုပ်မှု)', 'သုံးသပ်ချက်: စိတ်လှုပ်ရှားမှုကို ဘဝတိုးတက်ရေး အင်အားအဖြစ် ပြောင်းလဲလိုက်ခြင်းသည် သတင်းအချက်အလက် လုံးဝ အပြတ်ဖြတ်ထားသည့် ၏ အနှစ်သာရကို အပြည့်အဝ ပိုင်ဆိုင်လိုက်ခြင်း ဖြစ်သည်။')">
                <strong>(D)</strong> ထို စိတ်လှုပ်ရှားမှုကို အာရုံမပြုဘဲ မိမိ၏ ရည်မှန်းချက် သို့မဟုတ် ကိုယ်လက်လေ့ကျင့်ခန်းများထံ အာရုံပြောင်းလိုက်မည်။
            </button>
        </div>
    </div>

    <!-- RESULT EXPANSION SCREEN -->
    <div id="result-box">
        <span class="res-title" id="res-title"></span>
        <p class="res-desc" id="res-desc"></p>
        
        <button onclick="completeQuiz()" class="next-btn">CONTINUE TO NEXT PAGE →</button>
    </div>
</div>

<script>
    function showAnalysis(title, desc) {
        document.getElementById('options-group').style.display = 'none';
        document.getElementById('res-title').innerText = title;
        document.getElementById('res-desc').innerText = desc;
        document.getElementById('result-box').style.display = 'block';
    }

    function completeQuiz() {
        window.parent.postMessage("quizCompleted", "*");
    }
</script>

</body>
</html>
