<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 6 QUIZ | DASSY DIGITAL LIBRARY</title>
    <style>
        :root {
            --dark-emerald: #06231a;
            --black-bg: #020d09;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --bright-gold: #ffcf40;
        }
        body { 
            background: var(--black-bg); 
            color: var(--light-gold); 
            font-family: 'Pyidaungsu', sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(6, 35, 26, 0.4); 
            border: 1px solid var(--gold); 
            border-radius: 12px; 
            padding: 22px; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(2, 13, 9, 0.9);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        .phase-label { 
            font-size: 11px; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
            text-align: center;
        }
        .chapter-title {
            font-size: 14px;
            color: var(--bright-gold);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        h2 { 
            font-size: 14.5px; 
            line-height: 1.6; 
            margin: 15px 0; 
            color: #fff; 
            text-align: left; 
            font-weight: normal; 
        }
        
        .option { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            background: rgba(212, 175, 55, 0.04); 
            border: 1px solid rgba(212, 175, 55, 0.25); 
            color: #fff; 
            border-radius: 6px; 
            cursor: pointer; 
            text-align: left; 
            transition: 0.3s; 
            font-size: 13px; 
            line-height: 1.5;
            box-sizing: border-box;
        }
        .option:hover { 
            background: linear-gradient(45deg, #0a4030, var(--dark-emerald)); 
            border-color: var(--gold); 
            transform: translateX(5px); 
        }
        .option strong { color: var(--gold); }
        
        /* Result Box Styling */
        #result-box { 
            display: none; 
            margin-top: 15px; 
            padding: 20px; 
            border: 1px solid var(--gold); 
            background: rgba(6, 35, 26, 0.6); 
            border-radius: 8px; 
            animation: fadeInUp 0.5s ease-out; 
            border-left: 5px solid var(--gold);
        }
        .res-title { 
            font-size: 14.5px; 
            font-weight: bold; 
            color: var(--bright-gold); 
            margin-bottom: 12px; 
            display: block; 
            text-align: left;
            line-height: 1.5;
        }
        .res-desc { 
            color: #fff; 
            font-size: 13px; 
            line-height: 1.7; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        .next-btn { 
            display: block; 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(45deg, #0a4030, var(--gold), #0a4030); 
            color: #fff; 
            border: 1px solid var(--gold); 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center; 
            text-transform: uppercase; 
            transition: 0.3s;
            letter-spacing: 1px; 
            font-size: 13px;
        }
        .next-btn:hover { 
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 15px rgba(212,175,55,0.4); 
        }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <span class="phase-label">PAGE 47</span>
        <div class="chapter-title">Chapter 6 Quiz: Handling Breadcrumbs &amp; Test Contacts<br>(အကဲစမ်း စာတိုများကို ပါးနပ်စွာ ကိုင်တွယ်ခြင်း)</div>
        
        <h2><strong>မေးခွန်း -</strong> တဖက်လူထံမှ &quot;နေကောင်းလား&quot; သို့မဟုတ် အရေးမကြီးသော သတင်းမေးရုံ အကဲစမ်း စာတို (Breadcrumbs) ရောက်ရှိလာပါက မည်သို့ တုံ့ပြန်မည်နည်း။</h2>
        
        <div id="options-group">
            <button class="option" onclick="showAnalysis('(A) ကို ရွေးချယ်ပါက → Immediate Surrender (ချက်ချင်း အရှုံးပေးမှု)', 'သုံးသပ်ချက်: အကဲစမ်း စာတိုကို ဝမ်းသာအားရ ပြန်ခြင်းသည် တဖက်လူအား မိမိ၏ တန်ဖိုးကို ပေါ့ပါးသွားစေသည်။')">
                <strong>(A)</strong> ဝမ်းသာအားရဖြင့် ချက်ချင်း စာပြန်ပြီး ဆက်ဆံရေး ပုံမှန် ပြန်ဖြစ်ရန် ကြိုးစားမည်။
            </button>
            <button class="option" onclick="showAnalysis('(B) ကို ရွေးချယ်ပါက → Emotional Reactivity (ခံစားချက် တုံ့ပြန်မှု)', 'သုံးသပ်ချက်: လှောင်ပြောင် စိတ်ဆိုးခြင်းသည် သင့်ထံတွင် နာကျည်းချက်များ ကျန်ရှိနေသေးကြောင်း သက်သေပြနေသည်။')">
                <strong>(B)</strong> မကျေနပ်သည့် စကား သို့မဟုတ် လှောင်ပြောင်သော စာများ ပြန်ပို့လိုက်မည်။
            </button>
            <button class="option" onclick="showAnalysis('(C) ကို ရွေးချယ်ပါက → Overthinking Trap (အလွန်အကြူး တွေးတောသည့် ထောင်ချောက်)', 'သုံးသပ်ချက်: စာတိုတစ်စောင်အတွက် စိတ်ပူနေခြင်းသည် Power Dynamics ကို တဖက်လူထံ ဆက်လက် ပေးထားခြင်း ဖြစ်သည်။')">
                <strong>(C)</strong> မည်သို့ စာပြန်ရမည်နည်းဟု နာရီပေါင်းများစွာ စိတ်ပူ စဉ်းစားနေမည်။
            </button>
            <button class="option" onclick="showAnalysis('(D) ကို ရွေးချယ်ပါက → High-Value Boundary (တန်ဖိုးမြင့် စည်းတားမှု)', 'သုံးသပ်ချက်: တိုရှင်း ရင့်ကျက်စွာ တုံ့ပြန်ခြင်း သို့မဟုတ် ငြိမ်နေခြင်းသည် တဖက်လူအား အဆင်သင့် လွယ်ကူစွာ ရနိုင်သော အနေအထား မဟုတ်ကြောင်း စိတ္တဗေဒအရ ပြသလိုက်ခြင်း ဖြစ်သည်။')">
                <strong>(D)</strong> စိတ်လှုပ်ရှားမှု မပါဘဲ တိုတိုရှင်းရှင်း၊ ယဉ်ကျေးစွာ သာမန်အတိုင်း ဖြေဆိုမည် (သို့မဟုတ်) လုံးဝ အရေးမလုပ်ဘဲ ဥပေက္ခာပြုမည်။
            </button>
        </div>
    </div>

    <!-- RESULT EXPANSION SCREEN -->
    <div id="result-box">
        <span class="res-title" id="res-title"></span>
        <p class="res-desc" id="res-desc"></p>
        
        <button onclick="completeQuiz()" class="next-btn">CONTINUE TO NEXT PAGE →</button>
    </div>
</div>

<script>
    function showAnalysis(title, desc) {
        document.getElementById('options-group').style.display = 'none';
        document.getElementById('res-title').innerText = title;
        document.getElementById('res-desc').innerText = desc;
        document.getElementById('result-box').style.display = 'block';
    }

    function completeQuiz() {
        window.parent.postMessage("quizCompleted", "*");
    }
</script>

</body>
</html>
