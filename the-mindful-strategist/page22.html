<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 2 QUIZ | DASSY DIGITAL LIBRARY</title>
    <style>
        :root {
            --dark-burgundy: #2b0409;
            --black-bg: #0d0203;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --bright-gold: #ffcf40;
        }
        body { 
            background: var(--black-bg); 
            color: var(--light-gold); 
            font-family: 'Pyidaungsu', sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(43, 4, 9, 0.4); 
            border: 1px solid var(--gold); 
            border-radius: 12px; 
            padding: 22px; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(43, 4, 9, 0.9);
            backdrop-filter: blur(10px);
        }
        .phase-label { 
            font-size: 11px; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
            text-align: center;
        }
        .chapter-title {
            font-size: 14px;
            color: var(--bright-gold);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        h2 { font-size: 15px; line-height: 1.6; margin: 15px 0; color: #fff; text-align: left; font-weight: normal; }
        
        .option { 
            display: block; width: 100%; padding: 14px; margin: 12px 0; 
            background: rgba(212, 175, 55, 0.04); border: 1px solid rgba(212, 175, 55, 0.25); 
            color: #fff; border-radius: 6px; cursor: pointer; text-align: left; 
            transition: 0.3s; font-size: 13.5px; line-height: 1.5;
        }
        .option:hover { 
            background: linear-gradient(45deg, #520812, var(--dark-burgundy)); 
            border-color: var(--gold); 
            transform: translateX(5px); 
        }
        .option strong { color: var(--gold); }
        
        /* Result Box Styling */
        #result-box { 
            display: none; margin-top: 15px; padding: 20px; 
            border: 1px solid var(--gold); background: rgba(43, 4, 9, 0.6); 
            border-radius: 8px; animation: fadeInUp 0.5s ease-out; 
            border-left: 5px solid var(--gold);
        }
        .res-title { 
            font-size: 15px; font-weight: bold; color: var(--bright-gold); 
            margin-bottom: 12px; display: block; text-align: left;
        }
        .res-desc { color: #fff; font-size: 13.5px; line-height: 1.7; margin-bottom: 20px; text-align: left; }
        
        .next-btn { 
            display: block; width: 100%; padding: 15px; 
            background: linear-gradient(45deg, #520812, #8a1426); 
            color: #fff; border: 1px solid var(--gold); border-radius: 6px; font-weight: bold; 
            cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.3s;
            letter-spacing: 1px; font-size: 13px;
        }
        .next-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(212,175,55,0.4); }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <span class="phase-label">PAGE 22</span>
        <div class="chapter-title">အခန်း (၂) ဆန်းစစ်ချက်</div>
        
        <h2><strong>မေးခွန်း။ ။</strong> မိမိ၏ ဂုဏ်သိက္ခာနှင့် မငြင်းဆန်နိုင်သော စံနှုန်းများကို ထိန်းသိမ်းရန်အတွက် စည်းတံတိုင်း (Boundaries) ကို မည်သည့် နည်းလမ်းဖြင့် စိုက်ထူမည်နည်း။</h2>
        
        <div id="options-group">
            <button class="option" onclick="showAnalysis('နှုတ်ထွက်ရလဒ်အဖြေလွှာ (အခန်း ၂) - သင် (က) ကို ရွေးချယ်ပါက', 'သင်၏ စိတ်သည် တံခါးမရှိသော အိမ်နှင့်တူ၏။ စည်းတံတိုင်း မရှိသောအခါ သူတစ်ပါး၏ စေတနာဆိုးနှင့် လှည့်ကွက်များ လွတ်လပ်စွာ ဝင်ထွက်စိမ့်ဝင်ပြီး အနိုင်ကျင့်ခံ သားကောင်ဖြစ်ရလိမ့်မည်။')">
                <strong>(က)</strong> သူတစ်ပါး အကူအညီတောင်းလာသမျှကို မငြင်းဆန်ဘဲ မိမိစိတ်ထဲ မပါသော်လည်း အားနာစိတ်ဖြင့် အမြဲတမ်း လက်ခံပေးမည်။
            </button>
            <button class="option" onclick="showAnalysis('နှုတ်ထွက်ရလဒ်အဖြေလွှာ (အခန်း ၂) - သင် (ခ) ကို ရွေးချယ်ပါက', 'သင်သည် စည်းတံတိုင်း၏ သဘောတရားကို လွဲမှားစွာ နားလည်ထားသူ ဖြစ်၏။ ဒေါသဖြစ်ခြင်းနှင့် ရိုင်းစိုင်းခြင်းသည် စည်းတံတိုင်း စိုက်ထူခြင်း မဟုတ်ဘဲ မိမိ၏ စိတ်ဓာတ်မတည်ငြိမ်မှုကို ပြသရာ ရောက်သည်။')">
                <strong>(ခ)</strong> မိမိစည်းကို ကျော်လာသူတိုင်းကို ရိုင်းစိုင်းစွာ ပြန်လည်ငြင်းပယ်ပြီး ဒေါသဖြင့် တိုက်ခိုက် တားဆီးမည်။
            </button>
            <button class="option" onclick="showAnalysis('နှုတ်ထွက်ရလဒ်အဖြေလွှာ (အခန်း ၂) - သင် (ဂ) ကို ရွေးချယ်ပါက', 'မြင့်မြတ်လှပေသည်။ သင်သည် မေတ္တာနှင့် စည်းတံတိုင်းကို မတုန်လှုပ်သော ပညာဖြင့် ယှဉ်တွဲနိုင်သူ ဖြစ်၏။ တည်ငြိမ်သော စည်းတံတိုင်းသည် သူတစ်ပါးကို မပြစ်မှားဘဲ မိမိ၏ တန်ဖိုးကို မြှင့်တင်ပေးပေသည်။')">
                <strong>(ဂ)</strong> ဒေါသ သို့မဟုတ် တုန်လှုပ်ခြင်းမရှိဘဲ မိမိ၏ လက်ခံနိုင်သော အတိုင်းအတာနှင့် စံနှုန်းကို စကားလုံး အတိအကျဖြင့် တည်ငြိမ်စွာ ချပြမည်။
            </button>
        </div>
    </div>

    <!-- RESULT EXPANSION SCREEN -->
    <div id="result-box">
        <span class="res-title" id="res-title"></span>
        <p class="res-desc" id="res-desc"></p>
        
        <button onclick="completeQuiz()" class="next-btn">CONTINUE TO NEXT PAGE →</button>
    </div>
</div>

<script>
    function showAnalysis(title, desc) {
        document.getElementById('options-group').style.display = 'none';
        document.getElementById('res-title').innerText = title;
        document.getElementById('res-desc').innerText = desc;
        document.getElementById('result-box').style.display = 'block';
    }

    function completeQuiz() {
        window.parent.postMessage("quizCompleted", "*");
    }
</script>

</body>
</html>
