<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 4 QUIZ | DASSY DIGITAL LIBRARY</title>
    <style>
        :root {
            --dark-burgundy: #2b0409;
            --black-bg: #0d0203;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --bright-gold: #ffcf40;
        }
        body { 
            background: var(--black-bg); 
            color: var(--light-gold); 
            font-family: 'Pyidaungsu', sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(43, 4, 9, 0.4); 
            border: 1px solid var(--gold); 
            border-radius: 12px; 
            padding: 22px; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(43, 4, 9, 0.9);
            backdrop-filter: blur(10px);
        }
        .phase-label { 
            font-size: 11px; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
            text-align: center;
        }
        .chapter-title {
            font-size: 14px;
            color: var(--bright-gold);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        h2 { font-size: 15px; line-height: 1.6; margin: 15px 0; color: #fff; text-align: left; font-weight: normal; }
        
        .option { 
            display: block; width: 100%; padding: 14px; margin: 12px 0; 
            background: rgba(212, 175, 55, 0.04); border: 1px solid rgba(212, 175, 55, 0.25); 
            color: #fff; border-radius: 6px; cursor: pointer; text-align: left; 
            transition: 0.3s; font-size: 13.5px; line-height: 1.5;
        }
        .option:hover { 
            background: linear-gradient(45deg, #520812, var(--dark-burgundy)); 
            border-color: var(--gold); 
            transform: translateX(5px); 
        }
        .option strong { color: var(--gold); }
        
        /* Result Box Styling */
        #result-box { 
            display: none; margin-top: 15px; padding: 20px; 
            border: 1px solid var(--gold); background: rgba(43, 4, 9, 0.6); 
            border-radius: 8px; animation: fadeInUp 0.5s ease-out; 
            border-left: 5px solid var(--gold);
        }
        .res-title { 
            font-size: 15px; font-weight: bold; color: var(--bright-gold); 
            margin-bottom: 12px; display: block; text-align: left;
        }
        .res-desc { color: #fff; font-size: 13.5px; line-height: 1.7; margin-bottom: 20px; text-align: left; }
        
        .next-btn { 
            display: block; width: 100%; padding: 15px; 
            background: linear-gradient(45deg, #520812, #8a1426); 
            color: #fff; border: 1px solid var(--gold); border-radius: 6px; font-weight: bold; 
            cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.3s;
            letter-spacing: 1px; font-size: 13px;
        }
        .next-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(212,175,55,0.4); }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <span class="phase-label">PAGE 32</span>
        <div class="chapter-title">အခန်း (၄) ဆန်းစစ်ချက်</div>
        
        <h2><strong>မေးခွန်း။ ။</strong> တစ်ဖက်လူက သင့်အား လွန်လွန်ကဲကဲ ချီးမွမ်းခြင်း၊ ဂရုစိုက်ဟန်ပြခြင်း (Love Bombing) တို့ဖြင့် ချဉ်းကပ်လာပါက ယင်းစကားလုံးများနောက်ကွယ်မှ မဓုရသကြားနှင့် ဆိပ်ပုန်းကို မည်သို့ ချိန်ထိုးဆန်းစစ်မည်နည်း။</h2>
        
        <div id="options-group">
            <button class="option" onclick="showAnalysis('နှုတ်ထွက်ရလဒ်အဖြေလွှာ (အခန်း ၄) - သင် (က) ကို ရွေးချယ်ပါက', 'သင်သည် စကားလုံးတို့၏ ဆိပ်ပုန်းတွင် ငြိတွယ်သွားပြီ ဖြစ်၏။ လွန်ကဲသော ချီးမွမ်းခြင်းနောက်ကွယ်မှ ကင်းတဲမဲ့သွားသောအခါ သင်၏ စိတ်ဓာတ် ကာကွယ်ရေးတံတိုင်းမှာ လွယ်ကူစွာ ဖြိုဖျက်ခံရပေလိမ့်မည်။')">
                <strong>(က)</strong> မိမိကို ဂရုစိုက် စေတနာထားသည်ဟု သတ်မှတ်ကာ စည်းတံတိုင်းအားလုံးကို ဖြေလျှော့၍ စကားလုံးများ၏ အလှအပ၌ ပျော်မွေ့နေမည်။
            </button>
            <button class="option" onclick="showAnalysis('နှုတ်ထွက်ရလဒ်အဖြေလွှာ (အခန်း ၄) - သင် (ခ) ကို ရွေးချယ်ပါက', 'သင်သည် သတိထားမိသော်လည်း တုံ့ပြန်မှု လွဲမှားနေသူ ဖြစ်၏။ အငြင်းပွားခြင်းသည် စကားလုံး ပရိယာယ်ကြွယ်သူများအတွက် လမ်းစဖွင့်ပေးလိုက်ခြင်းသာ ဖြစ်ပြီး စိတ်အင်အားကိုသာ ကုန်ခမ်းစေသည်။')">
                <strong>(ခ)</strong> စကားလုံး အသုံးအနှုန်းကိုသာ မယုံသင်္ကာဖြစ်ပြီး စိတ်ထဲမှ မကျေမနပ်ဖြစ်ကာ တစ်ဖက်လူနှင့် စကားအငြင်းပွားမည်။
            </button>
            <button class="option" onclick="showAnalysis('နှုတ်ထွက်ရလဒ်အဖြေလွှာ (အခန်း ၄) - သင် (ဂ) ကို ရွေးချယ်ပါက', 'ပညာရှိပေသည်။ သင်သည် နှုတ်ထွက်စကားတို့၏ နောက်ကွယ်မှ အပြုအမူကို ဉာဏ်ဖြင့် ခွဲခြားသိမြင်သူ ဖြစ်၏။ သတိတည်းဟူသော ဇာတိကို ကိုင်စွဲထားသဖြင့် မဓုရသကြားဆန်သော ကျော့ကွင်း၌ မည်သည့်အခါမျှ ငြိတွယ်မည် မဟုတ်ပေ။')">
                <strong>(ဂ)</strong> စကားလုံး၏ အလှအပထက် ယင်း၏ နောက်ကွယ်ရှိ အပြုအမူ၊ တောင်းဆိုလာမည့် အကျိုးအမြတ်နှင့် အကျိုးဆက်ကို သတိပညာဖြင့် ချိန်ထိုးကြည့်မည်။
            </button>
        </div>
    </div>

    <!-- RESULT EXPANSION SCREEN -->
    <div id="result-box">
        <span class="res-title" id="res-title"></span>
        <p class="res-desc" id="res-desc"></p>
        
        <button onclick="completeQuiz()" class="next-btn">CONTINUE TO NEXT PAGE →</button>
    </div>
</div>

<script>
    function showAnalysis(title, desc) {
        document.getElementById('options-group').style.display = 'none';
        document.getElementById('res-title').innerText = title;
        document.getElementById('res-desc').innerText = desc;
        document.getElementById('result-box').style.display = 'block';
    }

    function completeQuiz() {
        window.parent.postMessage("quizCompleted", "*");
    }
</script>

</body>
</html>
