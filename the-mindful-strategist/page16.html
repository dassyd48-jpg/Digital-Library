<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHAPTER 1 QUIZ | DASSY DIGITAL LIBRARY</title>
    <style>
        :root {
            --dark-burgundy: #2b0409;
            --black-bg: #0d0203;
            --gold: #d4af37;
            --light-gold: #f3e5ab;
            --bright-gold: #ffcf40;
        }
        body { 
            background: var(--black-bg); 
            color: var(--light-gold); 
            font-family: 'Pyidaungsu', sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .quiz-container { 
            width: 100%; 
            max-width: 480px; 
            background: rgba(43, 4, 9, 0.4); 
            border: 1px solid var(--gold); 
            border-radius: 12px; 
            padding: 22px; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            box-shadow: 0 0 30px rgba(43, 4, 9, 0.9);
            backdrop-filter: blur(10px);
        }
        .phase-label { 
            font-size: 11px; 
            color: var(--gold); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: bold; 
            display: block; 
            margin-bottom: 5px;
            text-align: center;
        }
        .chapter-title {
            font-size: 14px;
            color: var(--bright-gold);
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }
        h2 { font-size: 15px; line-height: 1.6; margin: 15px 0; color: #fff; text-align: left; font-weight: normal; }
        
        .option { 
            display: block; width: 100%; padding: 14px; margin: 12px 0; 
            background: rgba(212, 175, 55, 0.04); border: 1px solid rgba(212, 175, 55, 0.25); 
            color: #fff; border-radius: 6px; cursor: pointer; text-align: left; 
            transition: 0.3s; font-size: 13.5px; line-height: 1.5;
        }
        .option:hover { 
            background: linear-gradient(45deg, #520812, var(--dark-burgundy)); 
            border-color: var(--gold); 
            transform: translateX(5px); 
        }
        .option strong { color: var(--gold); }
        
        /* Result Box Styling */
        #result-box { 
            display: none; margin-top: 15px; padding: 20px; 
            border: 1px solid var(--gold); background: rgba(43, 4, 9, 0.6); 
            border-radius: 8px; animation: fadeInUp 0.5s ease-out; 
            border-left: 5px solid var(--gold);
        }
        .res-title { 
            font-size: 15px; font-weight: bold; color: var(--bright-gold); 
            margin-bottom: 12px; display: block; text-align: left;
        }
        .res-desc { color: #fff; font-size: 13.5px; line-height: 1.7; margin-bottom: 20px; text-align: left; }
        
        .next-btn { 
            display: block; width: 100%; padding: 15px; 
            background: linear-gradient(45deg, #520812, #8a1426); 
            color: #fff; border: 1px solid var(--gold); border-radius: 6px; font-weight: bold; 
            cursor: pointer; text-align: center; text-transform: uppercase; transition: 0.3s;
            letter-spacing: 1px; font-size: 13px;
        }
        .next-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px rgba(212,175,55,0.4); }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-flow">
        <span class="phase-label">PAGE 16</span>
        <div class="chapter-title">အခန်း (၁) ဆန်းစစ်ချက်</div>
        
        <h2><strong>မေးခွန်း။ ။</strong> ပတ်ဝန်းကျင်မှ လူတစ်ယောက်က မိမိ၏ ဆုံးဖြတ်ချက်ကို သံသယဝင်လာအောင် စကားလုံးများဖြင့် ရှုပ်ထွေးအောင် လုပ်ဆောင်လာပါက (Gaslighting) ထိုပရိယာယ်ကို မည်သို့ ရိပ်စားဖတ်ရှုမည်နည်း။</h2>
        
        <div id="options-group">
            <button class="option" onclick="showAnalysis('နှုတ်ထွက်ရလဒ်အဖြေလွှာ (အခန်း ၁) - သင် (က) ကို ရွေးချယ်ပါက', 'သင်သည် တစ်ဖက်လူ၏ Gaslighting ကျော့ကွင်းအတွင်းသို့ သက်ဆင်းသွားပြီ ဖြစ်၏။ အမှန်တရားကို ဝေဝါးစေသော မဓုရစကားများအောက်တွင် မိမိ၏ စိတ်ဓာတ်ရေးရာ လွတ်လပ်ခွင့်ကို ပေးအပ်လိုက်ရလိမ့်မည်။')">
                <strong>(က)</strong> မိမိ၏ မှတ်ဉာဏ်နှင့် အသိဉာဏ်ကို မယုံကြည်တော့ဘဲ တစ်ဖက်လူ ပြောသည့်အတိုင်း လိုက်ပါပြောင်းလဲလိုက်မည်။
            </button>
            <button class="option" onclick="showAnalysis('နှုတ်ထွက်ရလဒ်အဖြေလွှာ (အခန်း ၁) - သင် (ခ) ကို ရွေးချယ်ပါက', 'သင်သည် ပရိယာယ်ကို ရိပ်မိသော်လည်း စိတ်အာရုံ ထိန်းချုပ်နိုင်စွမ်း မရှိသေးပေ။ ဒေါသဖြင့် တုံ့ပြန်ခြင်းသည် စိတ်အင်အားကို ကုန်ခမ်းစေပြီး တစ်ဖက်လူ၏ လှည့်ကွက်ထဲသို့ ပိုမို နက်ရှိုင်းစွာ ကျရောက်စေသည်။')">
                <strong>(ခ)</strong> တစ်ဖက်လူနှင့် စကားအနိုင်ငြင်းဆိုပြီး ဒေါသတကြီး တုံ့ပြန်၍ မိမိ မှန်ကန်ကြောင်း အတင်းအကျပ် သက်သေပြမည်။
            </button>
            <button class="option" onclick="showAnalysis('နှုတ်ထွက်ရလဒ်အဖြေလွှာ (အခန်း ၁) - သင် (ဂ) ကို ရွေးချယ်ပါက', 'ပါးနပ်လှပေသည်။ သင်သည် မမြင်နိုင်သော စိတ်၏ ကျော့ကွင်းများကို ပညာဖြင့် ခွဲခြားသိမြင်သူ ဖြစ်၏။ အမှန်တရားကို ဝေဝါးအောင် ဖန်တီးသော ပရိယာယ်မှန်သမျှ သင်၏ တည်ငြိမ်မှုရှေ့တွင် ပျက်စီးရပေလိမ့်မည်။')">
                <strong>(ဂ)</strong> စကားပြောဆိုသူ၏ စကားလုံးနှင့် မူရာ သဟဇာတဖြစ်မှုကို အကဲခတ်ပြီး မိမိ၏ မူလအမှန်တရားနှင့် စံနှုန်းကို တည်ငြိမ်စွာ ကိုင်စွဲထားမည်။
            </button>
        </div>
    </div>

    <!-- RESULT EXPANSION SCREEN -->
    <div id="result-box">
        <span class="res-title" id="res-title"></span>
        <p class="res-desc" id="res-desc"></p>
        
        <button onclick="completeQuiz()" class="next-btn">CONTINUE TO NEXT PAGE →</button>
    </div>
</div>

<script>
    function showAnalysis(title, desc) {
        document.getElementById('options-group').style.display = 'none';
        document.getElementById('res-title').innerText = title;
        document.getElementById('res-desc').innerText = desc;
        document.getElementById('result-box').style.display = 'block';
    }

    function completeQuiz() {
        window.parent.postMessage("quizCompleted", "*");
    }
</script>

</body>
</html>
