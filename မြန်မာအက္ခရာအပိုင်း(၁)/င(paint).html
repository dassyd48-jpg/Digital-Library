<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>"င" ကို အရောင်ခြယ်ပါ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pyidaungsu:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      position: relative; 
      background-color: #fbcfe8; 
      user-select: none; 
      -webkit-user-select: none;
      font-family: 'Fredoka', 'Pyidaungsu', system-ui, sans-serif;
    }

    #app-root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
    }

    /* TOP HEADER & CONTROLS */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 45px;
      flex-shrink: 0;
    }

    .btn-nav {
      background: #be123c;
      color: white;
      padding: 6px 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 0 #881337;
    }

    .sound-control {
      background: #be123c;
      padding: 4px 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 0 #881337;
    }

    /* MAIN CONTAINER: 1 Screen No-Scroll Layout */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: calc(100vh - 65px);
    }

    .title-banner {
      background: #be123c;
      color: white;
      text-align: center;
      padding: 6px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 4px 0 #881337;
    }

    /* PAINTING CANVAS FRAME */
    .canvas-frame {
      flex: 1;
      background: #fff;
      border-radius: 20px;
      border: 4px solid #f43f5e;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* BOTTOM PALETTE & CONTROL PANEL */
    .control-panel {
      background: #ffffff;
      border: 3px solid #f43f5e;
      border-radius: 20px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .panel-label {
      text-align: center;
      color: #be123c;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      justify-items: center;
    }

    .color-swatch, .eraser-btn {
      width: 100%;
      aspect-ratio: 1/1;
      max-width: 42px;
      max-height: 42px;
      border-radius: 10px;
      border: 2px solid #e2e8f0;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
    }

    .color-swatch.active, .eraser-btn.active {
      border: 3px solid #be123c;
      transform: scale(1.08);
      box-shadow: 0 0 8px rgba(190, 18, 60, 0.4);
    }

    .eraser-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .eraser-btn {
      width: 100%;
      max-width: 120px;
      height: 36px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #be123c;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .btn-action {
      width: 100%;
      padding: 8px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      color: white;
      border: none;
      cursor: pointer;
      text-align: center;
    }

    .btn-reset { background: #f43f5e; box-shadow: 0 3px 0 #be123c; }
    .btn-done { background: #e11d48; box-shadow: 0 3px 0 #9f1239; }
    .btn-action:active { transform: translateY(2px); box-shadow: none; }

    /* Desktop View Adaptability */
    @media (min-width: 768px) {
      .main-container { flex-direction: row; }
      .control-panel { width: 320px; height: 100%; }
      .color-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

  <div id="app-root">
    
    <!-- TOP NAVIGATION -->
    <div class="top-bar">
      <button class="btn-nav" onclick="location.href='index.html'">← Back</button>
      <div class="sound-control">
        <span>🔊</span>
        <input type="range" min="0" max="100" value="80" class="w-16 h-1 accent-yellow-300" />
      </div>
      <button class="btn-nav" onclick="location.href='index.html'">🏠 Home</button>
    </div>

    <!-- MAIN VIEW (SINGLE SCREEN) -->
    <div class="main-container">
      
      <!-- TITLE & CANVAS -->
      <div class="flex-1 flex flex-col gap-2 h-full">
        <div class="title-banner">
          အရောင်ခြယ်ပါ "<span style="color: #facc15;">C</span>" !
        </div>
        
        <div class="canvas-frame">
          <canvas id="paintCanvas"></canvas>
        </div>
      </div>

      <!-- BOTTOM / SIDE CONTROL PANEL -->
      <div class="control-panel">
        <div class="panel-label">BRUSHES</div>
        
        <div class="eraser-container">
          <div id="eraserBtn" class="eraser-btn">
            <span>🧽</span> Eraser
          </div>
        </div>

        <div id="colorGrid" class="color-grid"></div>

        <div class="action-buttons">
          <button id="btnReset" class="btn-action btn-reset">↺ အသစ်ပြန်စ</button>
          <button id="btnDone" class="btn-action btn-done">✓ ပြီးပြီ</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let currentColor = '#e11d48';
    let isEraser = false;

    const colors = [
      '#e11d48', '#38bdf8', '#f59e0b', '#10b981', '#a855f7',
      '#ec4899', '#f43f5e', '#eab308'
    ];

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      drawTraceLetter();
    }

    function drawTraceLetter() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const fontSize = Math.min(canvas.width, canvas.height) * 0.65;
      ctx.font = `900 ${fontSize}px Fredoka, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.strokeStyle = '#fda4af';
      ctx.lineWidth = 14;
      ctx.strokeText('C', canvas.width / 2, canvas.height / 2);
      
      ctx.fillStyle = '#fff1f2';
      ctx.fillText('C', canvas.width / 2, canvas.height / 2);
    }

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 50);

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) { painting = true; draw(e); }
    function stopDrawing() { painting = false; ctx.beginPath(); }
    
    function draw(e) {
      if (!painting) return;
      const pos = getPos(e);
      ctx.lineWidth = isEraser ? 30 : 16;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = isEraser ? '#ffffff' : currentColor;
      ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';

      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

    // UI Palette Generation
    const grid = document.getElementById('colorGrid');
    colors.forEach((col, index) => {
      const el = document.createElement('div');
      el.className = 'color-swatch' + (index === 0 ? ' active' : '');
      el.style.backgroundColor = col;
      el.onclick = () => {
        isEraser = false;
        currentColor = col;
        document.querySelectorAll('.color-swatch, .eraser-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
      };
      grid.appendChild(el);
    });

    document.getElementById('eraserBtn').onclick = () => {
      isEraser = true;
      document.querySelectorAll('.color-swatch, .eraser-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('eraserBtn').classList.add('active');
    };

    document.getElementById('btnReset').onclick = drawTraceLetter;
    document.getElementById('btnDone').onclick = () => alert('အရမ်းတော်တယ်!');
  </script>
</body>
</html>
