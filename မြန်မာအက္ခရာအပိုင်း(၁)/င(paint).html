<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dassy's Alphabet Quest - Painting Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Scroll လုံးဝ မလာစေရန် */
            position: relative;
            background-color: #022c22;
            font-family: 'Fredoka One', 'Pyidaungsu', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* App Wrapper */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            padding: 12px;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
        }

        /* Top HUD Bar */
        .hud-bar {
            width: 100%;
            max-width: 800px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(6, 78, 59, 0.8);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 0 12px;
            z-index: 20;
            flex-shrink: 0;
        }

        /* Main Workspace (Whiteboard Canvas Area) */
        .workspace-area {
            flex: 1;
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0; /* Important for flex-shrink working with Canvas */
        }

        .whiteboard-frame {
            width: 100%;
            height: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1; /* Square Area for Drawing */
            background: #064e3b;
            border: 6px solid #059669;
            border-radius: 24px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Bottom Control Panel */
        .control-panel {
            width: 100%;
            max-width: 800px;
            height: auto;
            background: rgba(6, 78, 59, 0.9);
            border: 2px solid #059669;
            border-radius: 20px;
            padding: 10px 14px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
            z-index: 20;
        }

        .color-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .color-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .color-btn.active {
            transform: scale(1.18);
            border-color: #f59e0b;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-ui {
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: bold;
            color: white;
            font-size: 13px;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn-ui:active { transform: translateY(2px); box-shadow: none; }
        
        .btn-reset { background: #e11d48; }
        .btn-eraser { background: #0284c7; }
        .btn-exit { background: #475569; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HUD HEADER -->
        <div class="hud-bar">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🎨</span>
                <span class="text-amber-400 font-bold text-sm tracking-wide">င - ကို ဆေးရောင်ခြယ်ပါ</span>
            </div>
            <button onclick="returnToMain()" class="btn-ui btn-exit">🚪 ထွက်မည်</button>
        </div>

        <!-- MAIN CANVAS WORKSPACE (No-Scroll Viewport) -->
        <div class="workspace-area">
            <div class="whiteboard-frame">
                <div class="canvas-container" id="canvasWrapper">
                    <canvas id="paintCanvas"></canvas>
                </div>
            </div>
        </div>

        <!-- BOTTOM COLOR PALETTE & CONTROLS -->
        <div class="control-panel">
            <!-- Palette Colors -->
            <div class="color-palette" id="colorPalette">
                <!-- Color items injected by JS -->
            </div>

            <!-- Action Buttons -->
            <div class="action-btns">
                <button id="eraserBtn" class="btn-ui btn-eraser">🧽 ဖျက်မည်</button>
                <button id="resetBtn" class="btn-ui btn-reset">🔄 ပြန်စမည်</button>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');

        let isDrawing = false;
        let currentColor = '#f59e0b';
        let isEraser = false;

        const colors = [
            '#f59e0b', '#ef4444', '#10b981', '#3b82f6', 
            '#8b5cf6', '#ec4899', '#ffffff', '#000000'
        ];

        // Canvas ရဲ့ Size ကို Screen ဘောင်ထဲ အံဝင်ခွင်ကျဖြစ်အောင် Auto Fit လုပ်ပေးသည့် Function
        function fitCanvas() {
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            drawOutline();
        }

        // "င" အက္ခရာ လမ်းကြောင်း အစက်လေးများ ဆွဲပေးခြင်း
        function drawOutline() {
            ctx.save();
            ctx.font = `900 ${canvas.height * 0.65}px Pyidaungsu, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 6;
            ctx.setLineDash([12, 10]);
            ctx.strokeText('င', canvas.width / 2, canvas.height / 2 + 10);
            ctx.restore();
        }

        // Draw Logic (Touch & Mouse)
        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startPaint(e) {
            isDrawing = true;
            paint(e);
        }

        function stopPaint() {
            isDrawing = false;
            ctx.beginPath();
        }

        function paint(e) {
            if (!isDrawing) return;
            const pos = getCoords(e);

            ctx.lineWidth = isEraser ? 36 : 18;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        // Event Listeners
        canvas.addEventListener('mousedown', startPaint);
        canvas.addEventListener('mousemove', paint);
        window.addEventListener('mouseup', stopPaint);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPaint(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); paint(e); }, { passive: false });
        window.addEventListener('touchend', stopPaint);

        // Render Color Palette
        const paletteContainer = document.getElementById('colorPalette');
        colors.forEach((color, idx) => {
            const btn = document.createElement('div');
            btn.className = `color-btn ${idx === 0 ? 'active' : ''}`;
            btn.style.backgroundColor = color;
            btn.onclick = () => {
                isEraser = false;
                currentColor = color;
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('eraserBtn').classList.remove('ring-2', 'ring-amber-400');
                btn.classList.add('active');
            };
            paletteContainer.appendChild(btn);
        });

        // Eraser Control
        document.getElementById('eraserBtn').onclick = function() {
            isEraser = true;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('ring-2', 'ring-amber-400');
        };

        // Reset Canvas
        document.getElementById('resetBtn').onclick = function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawOutline();
        };

        function returnToMain() {
            window.location.href = 'index.html?fromGame=true';
        }

        window.addEventListener('resize', fitCanvas);
        window.onload = fitCanvas;
    </script>
</body>
</html>
