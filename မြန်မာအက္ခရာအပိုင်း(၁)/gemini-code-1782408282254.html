<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Alphabet Quest - ဆ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;700;900&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Fredoka One', 'Pyidaungsu', 'Montserrat', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .burmese-font {
            font-family: 'Pyidaungsu', 'Myanmar3', 'Yunghkio', sans-serif;
        }
    </style>
</head>
<body class="relative text-white">

    <!-- HUD Overlay (ဘယ်ဘက်အပေါ် - Progress Bar & Target Display) -->
    <div id="hud" class="absolute top-4 left-4 right-4 pointer-events-none z-30 flex flex-col space-y-2 max-w-md">
        <div class="flex items-center space-x-3 bg-slate-900/90 backdrop-blur-md p-3 rounded-2xl border border-white/10 shadow-lg">
            <span class="text-xs font-black text-[#5ce1e6] tracking-wider uppercase">Learning Progress</span>
            <div class="flex-1 bg-black/40 h-4 rounded-full overflow-hidden p-0.5 border border-white/5">
                <div id="xp-bar" class="bg-gradient-to-r from-[#00f2fe] to-[#4facfe] h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <span id="level-display" class="bg-[#5ce1e6] text-black text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Lvl 1</span>
        </div>
        
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2 bg-slate-900/90 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/10 shadow-lg">
                <span class="text-xl">⭐️</span>
                <span id="cash-display" class="text-white font-black tracking-widest text-sm">0</span>
            </div>
            <div class="flex items-center space-x-2 bg-gradient-to-r from-purple-500/20 to-pink-500/20 backdrop-blur-md px-4 py-2 rounded-2xl border border-pink-500/40 shadow-lg animate-pulse">
                <span class="text-xs font-black text-pink-400 uppercase tracking-wider">Target:</span>
                <span id="target-letter-display" class="burmese-font text-xl font-bold text-pink-300">ဆ</span>
            </div>
        </div>
    </div>

    <!-- HP Display & Exit Button (ညာဘက်အပေါ်) -->
    <div class="absolute top-4 right-4 z-40 flex items-center space-x-2">
        <div class="pointer-events-none flex items-center space-x-2 bg-slate-900/90 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/10 shadow-lg">
            <span class="text-lg">❤️</span>
            <span id="hp-display" class="text-rose-500 font-black tracking-wider text-sm">100 / 100</span>
        </div>
        
        <button id="exit-btn" class="hidden pointer-events-auto flex items-center justify-center bg-rose-600 hover:bg-rose-500 text-white font-black px-4 py-2.5 rounded-2xl border-b-4 border-rose-800 active:scale-95 transition-all shadow-lg text-sm">
            🚪 <span class="ml-1 burmese-font text-xs font-bold tracking-wide">ထွက်မည်</span>
        </button>
    </div>

    <!-- Upgrade Power-Up Modal -->
    <div id="upgrade-modal" class="hidden absolute inset-0 bg-black/85 backdrop-blur-md z-[100] flex items-center justify-center p-6 transition-all duration-300">
        <div class="bg-[#121212] border-2 border-purple-500/20 rounded-[3rem] p-10 max-w-md w-full text-center shadow-[0_0_100px_rgba(168,85,247,0.15)] scale-95 transition-transform">
            <div class="relative mb-8">
                <div class="text-4xl">✨🚀✨</div>
            </div>
            <h2 class="text-3xl font-black text-purple-400 tracking-wider mb-2 uppercase">COSMIC UPGRADE!</h2>
            <p class="text-neutral-500 text-xs tracking-widest mb-8 uppercase">Select your space tech power-up</p>
            <div id="upgrade-options" class="space-y-4"></div>
        </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Joystick Zone -->
    <div id="joystick-zone" class="absolute bottom-12 left-12 w-32 h-32 bg-white/5 border border-white/10 rounded-full flex items-center justify-center pointer-events-auto touch-none z-30 shadow-2xl active:bg-white/10 transition-colors">
        <div id="joystick-knob" class="w-12 h-12 bg-white/20 border border-white/40 rounded-full transition-transform duration-75"></div>
    </div>

    <!-- Fullscreen Overlay Screen (Start / Game Over Menu) -->
    <div id="overlay-screen" class="absolute inset-0 bg-black/95 backdrop-blur-md z-[90] flex flex-col items-center justify-center text-center p-8">
        <h1 class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 tracking-widest mb-2 uppercase drop-shadow-[0_0_30px_rgba(168,85,247,0.3)]">COSMIC EXPEDITION</h1>
        <p class="text-cyan-400 text-[10px] uppercase font-black tracking-[0.5em] mb-12">Dassy's Burmese Alphabet Mission: "ဆ"</p>
        
        <!-- Stats Layout -->
        <div id="game-stats" class="hidden bg-white/5 border border-white/5 rounded-3xl p-6 mb-10 max-w-xs w-full text-left space-y-3 font-sans">
            <div class="flex justify-between"><span class="text-neutral-400 burmese-font">မှန်ကန်သော အက္ခရာများ</span><span id="stat-coins" class="text-white font-bold">0</span></div>
            <div class="flex justify-between"><span class="text-neutral-400 burmese-font">မှားယွင်းသော အက္ခရာများ</span><span id="stat-kills" class="text-white font-bold">0</span></div>
            <div class="flex justify-between"><span class="text-neutral-400 burmese-font">ရောက်ရှိသွားသော အဆင့်</span><span id="stat-level" class="text-[#5ce1e6] font-bold">Lvl 1</span></div>
        </div>

        <!-- Buttons Container -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center pointer-events-auto w-full max-w-md">
            <button id="start-btn" class="w-full sm:w-auto px-10 py-5 bg-purple-600 hover:bg-purple-500 text-white font-black text-xs uppercase tracking-[0.2em] rounded-full transition-all shadow-[0_15px_40px_rgba(147,51,234,0.3)] border-b-4 border-purple-800 active:scale-95 burmese-font">
                🔄 စတင်ကစားမည်
            </button>
            <button id="main-page-btn" class="w-full sm:w-auto px-10 py-5 bg-rose-600 hover:bg-rose-500 text-white font-black text-xs uppercase tracking-[0.2em] rounded-full transition-all shadow-[0_15px_40px_rgba(225,29,72,0.3)] border-b-4 border-rose-800 active:scale-95 burmese-font">
                🚪 ပင်မစာမျက်နှာ (Main Page)
            </button>
        </div>
    </div>

    <script>
        // --- Web Audio Synthesizer Engine ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
                gainNode.gain.setValueAtTime(0.06, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'hit') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.1);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(900, now + 0.07);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'fail') {
                osc.type = 'square'; osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.3);
                gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'levelup') {
                [440, 554, 659, 880].forEach((f, i) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination); o.type = 'sine';
                    o.frequency.setValueAtTime(f, now + i * 0.05); g.gain.setValueAtTime(0.05, now + i * 0.05);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.2);
                    o.start(now + i * 0.05); o.stop(now + i * 0.05 + 0.2);
                });
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        const burmeseAlphabets = ['က', 'ခ', 'ဂ', 'ဃ', 'င', 'စ', 'ဆ', 'ဇ', 'ဈ', 'ည', 'တ', 'ထ', 'ဒ', 'ဓ', 'န', 'ပ', 'ဖ', 'ဗ', 'ဘ', 'မ', 'ယ', 'ရ', 'လ', 'ဝ', 'သ', 'ဟ', 'ဠ', 'အ'];

        // --- "ဆ" ရဲ့ မူရင်း နေရာမရွေ့သော Space Center Shooter Mode ကစားဟန် ---
        const game = { running: false, paused: false, score: 0, correctPops: 0, incorrectPops: 0, targetLetter: 'ဆ' };
        
        const player = {
            x: 0, y: 0, radius: 25, angle: 0,
            hp: 100, maxHp: 100, xp: 0, maxXp: 100, level: 1,
            damage: 50, shootCooldown: 0.25, lastShotTime: 0
        };

        const entities = { projectiles: [], spaceAliens: [], stars: [] };
        const keys = {};

        // အာကာသ နောက်ခံ ကြယ်များ တည်ဆောက်ခြင်း
        function initSpaceBackground() {
            entities.stars = [];
            for (let i = 0; i < 100; i++) {
                entities.stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, alpha: Math.random() });
            }
        }

        // ရန်သူ ဂြိုဟ်သား/စာလုံးပူဖောင်းများ ပတ်လည်မှ စုပြုံတိုးဝင်လာစေမည့် မူရင်း Logic
        function spawnSpaceAlien() {
            if (!game.running || game.paused) return;
            
            // မျက်နှာပြင် အပြင်ဘက် ပတ်ပတ်လည် ဘောင်တစ်ခုခုကနေ Spawn မည်
            let x, y;
            const edge = Math.floor(Math.random() * 4);
            if (edge === 0) { x = Math.random() * canvas.width; y = -30; }
            else if (edge === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
            else if (edge === 2) { x = Math.random() * canvas.width; y = canvas.height + 30; }
            else { x = -30; y = Math.random() * canvas.height; }

            const isTarget = Math.random() < 0.35;
            let chosenLetter = game.targetLetter;
            if (!isTarget) {
                const filtered = burmeseAlphabets.filter(c => c !== game.targetLetter);
                chosenLetter = filtered[Math.floor(Math.random() * filtered.length)];
            }

            entities.spaceAliens.push({
                x, y, letter: chosenLetter,
                speed: 1.0 + (player.level * 0.15) + Math.random() * 0.5,
                radius: 24, pulse: Math.random() * Math.PI
            });
        }
        setInterval(spawnSpaceAlien, 1000);

        // Joystick နှင့် Keyboard ထိန်းချုပ်မှုများ
        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false; let joystickStart = { x: 0, y: 0 }; let joystickDir = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            joystickActive = true; const rect = joystickZone.getBoundingClientRect();
            joystickStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            e.preventDefault();
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
            if (!joystickActive) return; const touch = e.touches[0];
            const dx = touch.clientX - joystickStart.x; const dy = touch.clientY - joystickStart.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0) {
                const angle = Math.atan2(dy, dx); const bounded = Math.min(dist, 50);
                joystickDir = { x: Math.cos(angle), y: Math.sin(angle) };
                joystickKnob.style.transform = `translate(${joystickDir.x * bounded}px, ${joystickDir.y * bounded}px)`;
                player.angle = angle; // Joystick ဆွဲရာဘက်သို့ မျက်နှာမူလှည့်မည်
            }
            e.preventDefault();
        }, { passive: false });

        joystickZone.addEventListener('touchend', (e) => {
            joystickActive = false; joystickDir = { x: 0, y: 0 }; joystickKnob.style.transform = 'translate(0px, 0px)';
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // Auto Shoot or Tap to Shoot Mechanics
        canvas.addEventListener('mousedown', (e) => { fireLaser(e.clientX, e.clientY); });
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const jRect = joystickZone.getBoundingClientRect();
            if (touch.clientX >= jRect.left && touch.clientX <= jRect.right && touch.clientY >= jRect.top && touch.clientY <= jRect.bottom) return;
            fireLaser(touch.clientX, touch.clientY);
        }, { passive: true });

        function fireLaser(targetX, targetY) {
            if (!game.running || game.paused) return;
            const now = Date.now() / 1000;
            if (now - player.lastShotTime < player.shootCooldown) return;

            const dx = targetX - player.x; const dy = targetY - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist === 0) return;

            playSound('shoot');
            player.angle = Math.atan2(dy, dx);
            entities.projectiles.push({ x: player.x, y: player.y, vx: (dx / dist) * 12, vy: (dy / dist) * 12, radius: 5 });
            player.lastShotTime = now;
        }

        const UPGRADE_POOL = [
            { id: 'atk', name: 'Hyper Laser', desc: '-20% Weapon Cooldown Speed', stat: 'shootCooldown', factor: 0.8 },
            { id: 'hp', name: 'Nanite Repair', desc: 'Instantly Restore +30 Integrity Pool', stat: 'hp_heal', factor: 30 }
        ];

        function triggerLevelUp() {
            playSound('levelup'); player.level++; player.xp = 0; player.maxXp = Math.round(player.maxXp * 1.4);
            const container = document.getElementById('upgrade-options'); container.innerHTML = '';
            UPGRADE_POOL.forEach(upg => {
                const btn = document.createElement('button');
                btn.className = "w-full p-5 bg-[#1a1a1a] border border-purple-500/30 hover:border-pink-500 rounded-2xl flex items-center justify-between text-left transition-all active:scale-95";
                btn.innerHTML = `<div><h4 class="text-white font-black text-sm tracking-wide uppercase">${upg.name}</h4><p class="text-neutral-500 text-[10px] mt-1 uppercase tracking-wider">${upg.desc}</p></div><span>🚀</span>`;
                btn.onclick = () => {
                    if (upg.stat === 'hp_heal') player.hp = Math.min(player.maxHp, player.hp + upg.factor);
                    else player[upg.stat] *= upg.factor;
                    document.getElementById('upgrade-modal').classList.add('hidden'); game.paused = false;
                };
                container.appendChild(btn);
            });
            document.getElementById('upgrade-modal').classList.remove('hidden'); game.paused = true;
        }

        // Game Update Physics Engine Loop
        let lastTime = performance.now();
        function updateGame(dt) {
            if (!game.running || game.paused) return;

            // Keyboard လှည့်ပတ်မှု Logic
            if (keys['a'] || keys['arrowleft']) player.angle -= 0.05 * dt;
            if (keys['d'] || keys['arrowright']) player.angle += 0.05 * dt;
            if (keys['w'] || keys['arrowup'] || keys[' ']) {
                // အလိုအလျောက် အရှေ့တည့်တည့်သို့ ပစ်ခတ်ခြင်း
                const now = Date.now() / 1000;
                if (now - player.lastShotTime > player.shootCooldown) {
                    playSound('shoot');
                    entities.projectiles.push({ x: player.x, y: player.y, vx: Math.cos(player.angle) * 12, vy: Math.sin(player.angle) * 12, radius: 5 });
                    player.lastShotTime = now;
                }
            }

            // Lasers Update
            for (let i = entities.projectiles.length - 1; i >= 0; i--) {
                const p = entities.projectiles[i]; p.x += p.vx * dt; p.y += p.vy * dt;
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) { entities.projectiles.splice(i, 1); continue; }

                let hit = false;
                for (let j = entities.spaceAliens.length - 1; j >= 0; j--) {
                    const alien = entities.spaceAliens[j];
                    const dist = Math.hypot(alien.x - p.x, alien.y - p.y);
                    if (dist < alien.radius + p.radius) {
                        hit = true;
                        if (alien.letter === game.targetLetter) {
                            playSound('hit'); game.correctPops++; game.score += 20; player.xp += 35;
                            if (player.xp >= player.maxXp) triggerLevelUp();
                        } else {
                            playSound('fail'); game.incorrectPops++; player.hp = Math.max(0, player.hp - 5);
                            if (player.hp <= 0) gameOver();
                        }
                        entities.spaceAliens.splice(j, 1); break;
                    }
                }
                if (hit) entities.projectiles.splice(i, 1);
            }

            // Aliens Update (ဗဟိုချက်ရှိ အာကာသယာဉ်ဆီသို့ ဦးတည်တိုးဝင်လာခြင်း)
            for (let i = entities.spaceAliens.length - 1; i >= 0; i--) {
                const alien = entities.spaceAliens[i]; alien.pulse += 0.05 * dt;
                const dx = player.x - alien.x; const dy = player.y - alien.y; const dist = Math.hypot(dx, dy);
                
                alien.x += (dx / dist) * alien.speed * dt; alien.y += (dy / dist) * alien.speed * dt;

                // ဗဟိုသင်္ဘောနှင့် တိုက်မိသွားလျှင်
                if (dist < player.radius + alien.radius) {
                    if (alien.letter === game.targetLetter) {
                        playSound('coin'); game.correctPops++; game.score += 10; player.xp += 20;
                        if (player.xp >= player.maxXp) triggerLevelUp();
                    } else {
                        playSound('fail'); player.hp = Math.max(0, player.hp - 15);
                        if (player.hp <= 0) gameOver();
                    }
                    entities.spaceAliens.splice(i, 1);
                }
            }

            // Sync UI Elements
            document.getElementById('xp-bar').style.width = `${(player.xp / player.maxXp) * 100}%`;
            document.getElementById('level-display').innerText = `Lvl ${player.level}`;
            document.getElementById('cash-display').innerText = game.score;
            document.getElementById('hp-display').innerText = `${Math.round(player.hp)} / ${player.maxHp}`;
        }

        // Canvas Rendering System
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Space Stars Background
            entities.stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // 2. Draw Lasers Projectiles
            entities.projectiles.forEach(p => {
                ctx.fillStyle = '#ec4899'; ctx.shadowBlur = 10; ctx.shadowColor = '#ec4899';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 3. Draw Cosmic Enemy Letters (ဆ နှင့် အခြားစာလုံးများ)
            entities.spaceAliens.forEach(alien => {
                const sizeBonus = Math.sin(alien.pulse) * 2;
                const r = alien.radius + sizeBonus;
                
                // Outer Sci-Fi Orb Glow Effect
                let isTarget = alien.letter === game.targetLetter;
                ctx.fillStyle = isTarget ? 'rgba(236,72,153,0.15)' : 'rgba(168,85,247,0.15)';
                ctx.beginPath(); ctx.arc(alien.x, alien.y, r + 6, 0, Math.PI * 2); ctx.fill();

                // Core Bubble Base
                ctx.strokeStyle = isTarget ? '#ec4899' : '#a855f7'; ctx.lineWidth = 3;
                ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(alien.x, alien.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                // Text Graphic Inside Element
                ctx.fillStyle = '#ffffff'; ctx.font = `bold 22px Pyidaungsu, sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(alien.letter, alien.x, alien.y + 2);
            });

            // 4. Draw Center Player Space Ship (ဗဟိုချက်တွင် ငြိမ်နေပြီး လှည့်ရုံသာလှည့်မည်)
            ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
            // Outer Shield Rings
            ctx.strokeStyle = 'rgba(6,182,212,0.3)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, player.radius + 8, 0, Math.PI*2); ctx.stroke();
            // Ship Body Core Vector
            ctx.fillStyle = '#06b6d4'; ctx.beginPath(); ctx.moveTo(25, 0); ctx.lineTo(-15, -18); ctx.lineTo(-5, 0); ctx.lineTo(-15, 18); ctx.closePath(); ctx.fill();
            // Cockpit Glow
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(5, 0, 4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        function gameLoop(now) {
            let dt = (now - lastTime) / 16.666; lastTime = now; if (dt > 4) dt = 4;
            updateGame(dt); render(); requestAnimationFrame(gameLoop);
        }

        function startGame() {
            player.x = canvas.width / 2; player.y = canvas.height / 2; // အမြဲတမ်းအလယ်ဗဟိုမှာရှိနေမယ်
            player.hp = player.maxHp; player.xp = 0; player.level = 1; player.angle = 0;
            game.score = 0; game.correctPops = 0; game.incorrectPops = 0;
            entities.spaceAliens = []; entities.projectiles = [];
            
            initSpaceBackground();
            document.getElementById('overlay-screen').classList.add('hidden');
            document.getElementById('exit-btn').classList.remove('hidden');
            game.running = true;
        }

        function returnToMainPage() { game.running = false; window.location.href = 'index.html?fromGame=true'; }

        function gameOver() {
            game.running = false; document.getElementById('exit-btn').classList.add('hidden');
            document.getElementById('stat-coins').innerText = game.correctPops;
            document.getElementById('stat-kills').innerText = game.incorrectPops;
            document.getElementById('stat-level').innerText = `Lvl ${player.level}`;
            document.getElementById('game-stats').classList.remove('hidden');
            document.getElementById('start-btn').innerText = "🔄 ပြန်လည်ကစားမည်";
            document.getElementById('overlay-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').onclick = startGame;
        document.getElementById('exit-btn').onclick = returnToMainPage;
        document.getElementById('main-page-btn').onclick = function() { window.location.href = 'index.html?fromGame=true'; };

        window.onload = function() { requestAnimationFrame(gameLoop); };
    </script>
</body>
</html>
