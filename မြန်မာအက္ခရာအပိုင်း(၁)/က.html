<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>"က"အက္ခရာ လေ့ကျင့်ခန်း</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;700;900&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #022c22;
            font-family: 'Fredoka One', 'Pyidaungsu', 'Montserrat', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .burmese-font {
            font-family: 'Pyidaungsu', 'Myanmar3', 'Yunghkio', sans-serif;
        }
    </style>
</head>
<body class="relative">

    <!-- ညီညီညာညာ စီစဉ်ထားသော Top Header Navigation Bar -->
    <div id="top-bar" class="absolute top-2 left-2 right-2 z-30 flex items-center justify-between gap-2 bg-emerald-950/90 backdrop-blur-md px-3 py-2 rounded-2xl border border-emerald-500/20 shadow-lg">
        
        <!-- အဆင့်နှင့် Progress Bar -->
        <div class="flex items-center space-x-2 flex-1 max-w-[140px] sm:max-w-xs">
            <span id="level-display" class="burmese-font bg-emerald-800 text-white text-[10px] sm:text-xs font-bold px-2 py-1 rounded-lg shrink-0">အဆင့် ၁</span>
            <div class="flex-1 bg-black/50 h-3 rounded-full overflow-hidden border border-white/10">
                <div id="xp-bar" class="bg-gradient-to-r from-amber-500 to-green-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- ရှာဖွေရန် အက္ခရာ -->
        <div class="flex items-center space-x-1.5 bg-emerald-900/80 px-2.5 py-1 rounded-xl border border-amber-500/30">
            <span class="burmese-font text-[10px] sm:text-xs text-amber-400 font-bold">ရှာရန်-</span>
            <span id="target-letter-display" class="burmese-font text-lg sm:text-xl font-black text-amber-300">က</span>
        </div>

        <!-- အမှတ် / ရမှတ် -->
        <div class="flex items-center space-x-1 bg-emerald-900/50 px-2 py-1 rounded-xl">
            <span class="text-sm">🐅</span>
            <span id="cash-display" class="text-white font-bold text-xs sm:text-sm">0</span>
        </div>

        <!-- ထွက်မည် ခလုတ် -->
        <button id="exit-btn" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl border-b-2 border-rose-800 active:scale-95 transition-all flex items-center shrink-0">
            🚪 <span class="ml-1 burmese-font hidden sm:inline">ထွက်မည်</span>
        </button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- ဂိမ်းစတင်ရန် သို့မဟုတ် အနိုင်ရရှိသည့်မျက်နှာပြင် -->
    <div id="overlay-screen" class="absolute inset-0 bg-emerald-950/95 backdrop-blur-md z-[90] flex flex-col items-center justify-center text-center p-6">
        <h1 id="modal-title" class="burmese-font text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-emerald-400 to-green-500 tracking-widest mb-2 uppercase drop-shadow-[0_0_30px_rgba(245,158,11,0.3)]">တောတွင်း ဟိန်းသံ</h1>
        <p id="modal-subtitle" class="burmese-font text-emerald-300 text-xs uppercase font-bold tracking-widest mb-8">မြန်မာစာအက္ခရာ ရှာဖွေရေးစွန့်စားခန်း</p>
        
        <div id="game-stats" class="hidden bg-white/5 border border-white/10 rounded-3xl p-6 mb-8 max-w-xs w-full text-left space-y-3 font-sans">
            <div class="flex justify-between flex-row-reverse"><span id="stat-coins" class="text-amber-400 font-bold">0</span><span class="burmese-font text-emerald-200 text-xs">မှန်ကန်စွာ ပစ်ခတ်နိုင်မှု</span></div>
            <div class="flex justify-between flex-row-reverse"><span id="stat-kills" class="text-rose-400 font-bold">0</span><span class="burmese-font text-emerald-200 text-xs">မှားယွင်းပစ်ခတ်မှု</span></div>
            <div class="flex justify-between flex-row-reverse"><span id="stat-level" class="text-emerald-400 font-bold">အဆင့် ၁</span><span class="burmese-font text-emerald-200 text-xs">ရောက်ရှိခဲ့သည့် အဆင့်</span></div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center pointer-events-auto w-full max-w-md">
            <button id="start-btn" class="w-full sm:w-auto px-8 py-4 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs uppercase tracking-wider rounded-full transition-all shadow-lg border-b-4 border-amber-800 active:scale-95 burmese-font">
                🔄 စတင်ကစားမည်
            </button>
            <button id="main-page-btn" class="w-full sm:w-auto px-8 py-4 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs uppercase tracking-wider rounded-full transition-all shadow-lg border-b-4 border-rose-800 active:scale-95 burmese-font">
                🚪 သင်ခန်းစာမျက်နှာသို့
            </button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'shoot') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.04, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(550, now);
                osc.frequency.setValueAtTime(850, now + 0.05);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                osc.start(now);
                osc.stop(now + 0.14);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.25);
                gainNode.gain.setValueAtTime(0.07, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'win') {
                const freqs = [400, 520, 680, 850, 1100];
                freqs.forEach((f, i) => {
                    const oscSeq = audioCtx.createOscillator();
                    const gainSeq = audioCtx.createGain();
                    oscSeq.connect(gainSeq);
                    gainSeq.connect(audioCtx.destination);
                    oscSeq.type = 'sine';
                    oscSeq.frequency.setValueAtTime(f, now + i * 0.06);
                    gainSeq.gain.setValueAtTime(0.05, now + i * 0.06);
                    gainSeq.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.12);
                    oscSeq.start(now + i * 0.06);
                    oscSeq.stop(now + i * 0.06 + 0.12);
                });
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const burmeseAlphabets = ['က', 'ခ', 'ဂ', 'ဃ', 'င', 'စ', 'ဆ', 'ဇ', 'ဈ', 'ည', 'တ', 'ထ', 'ဒ', 'ဓ', 'န', 'ပ', 'ဖ', 'ဗ', 'ဘ', 'မ', 'ယ', 'ရ', 'လ', 'ဝ', 'သ', 'ဟ', 'ဠ', 'အ'];
        
        // အဆင့် ၃ ဆင့်အတွက် လိုအပ်သော အက္ခရာ အရေအတွက် သတ်မှတ်ချက်များ
        const levelRequirements = {
            1: 5,   // အဆင့် ၁ အတွက် ၅ လုံး
            2: 10,  // အဆင့် ၂ အတွက် ၁၀ လုံး
            3: 15   // အဆင့် ၃ အတွက် ၁၅ လုံး (ပြီးပါက ပွဲနိုင်မည်)
        };

        const game = {
            running: false,
            score: 0,
            correctPops: 0,
            incorrectPops: 0,
            targetLetter: 'က',
            camera: { x: 0, y: 0 }
        };

        const player = {
            x: 0, playerY: 0,
            angle: 0, radius: 22, 
            level: 1, currentLevelHits: 0,
            speed: 6.0, range: 310,
            shootCooldown: 0.16, lastShotTime: 0
        };

        const keys = {};
        const entities = { projectiles: [], letterBubbles: [], scenery: [] };

        function initScenery() {
            entities.scenery = [];
            const mapRadius = 1600;
            for (let i = 0; i < 26; i++) {
                entities.scenery.push({
                    type: 'pillar',
                    x: (Math.random() - 0.5) * mapRadius * 2,
                    y: (Math.random() - 0.5) * mapRadius * 2,
                    radius: 25 + Math.random() * 25,
                    color: Math.random() > 0.5 ? '#065f46' : '#0f766e' 
                });
            }
            for (let i = 0; i < 35; i++) {
                entities.scenery.push({
                    type: 'flower',
                    x: (Math.random() - 0.5) * mapRadius * 2,
                    y: (Math.random() - 0.5) * mapRadius * 2,
                    radius: 6 + Math.random() * 6,
                    color: Math.random() > 0.5 ? '#f43f5e' : '#ec4899'
                });
            }
        }

        function changeTargetLetter() {
            game.targetLetter = 'က';
            document.getElementById('target-letter-display').innerText = game.targetLetter;
        }

        function drawPillar(ctx, x, y, radius, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.arc(4, 6, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawFlower(ctx, x, y, radius, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            for (let i = 0; i < 4; i++) {
                ctx.rotate(Math.PI / 2);
                ctx.beginPath();
                ctx.ellipse(radius * 0.6, 0, radius * 0.6, radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawPlayer(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(player.angle);
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.ellipse(0, 4, 13, 17, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, -14, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#b45309';
            ctx.beginPath(); ctx.arc(-8, -22, 4.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -22, 4.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(0, -10, 4.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1c1917';
            ctx.beginPath(); ctx.moveTo(-2.5, -11); ctx.lineTo(2.5, -11); ctx.lineTo(0, -8); ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawJungleTotem(ctx, orb) {
            const { x, y, letter, scale } = orb;
            const isTarget = letter === game.targetLetter;
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = isTarget ? '#b45309' : '#064e3b';
            ctx.beginPath();
            ctx.roundRect(-17 * scale, -17 * scale, 34 * scale, 34 * scale, 8 * scale);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 11 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = isTarget ? '#78350f' : '#022c22';
            ctx.font = `bold ${21 * scale}px Pyidaungsu, sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillText(letter, 0, 0);
            ctx.restore();
        }

        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        canvas.addEventListener('mousedown', (e) => {
            if (!game.running) return;
            fireManualProjectile(e.clientX, e.clientY);
        });
        canvas.addEventListener('touchstart', (e) => {
            if (!game.running) return;
            fireManualProjectile(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        function fireManualProjectile(screenX, screenY) {
            const now = Date.now() / 1000;
            if (now - player.lastShotTime < player.shootCooldown) return;

            const worldX = screenX + game.camera.x;
            const worldY = screenY + game.camera.y;
            const dx = worldX - player.x;
            const dy = worldY - player.playerY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist === 0) return;

            playSound('shoot');
            entities.projectiles.push({
                x: player.x,
                y: player.playerY,
                vx: (dx / dist) * 16.0, 
                vy: (dy / dist) * 16.0,
                radius: 4.5
            });
            player.lastShotTime = now;
        }

        function spawnLetterBubble() {
            if (!game.running) return;
            const angle = Math.random() * Math.PI * 2;
            const dist = 120 + Math.random() * 130; // ကစားသမား အနီးဝန်းကျင်တွင် ပေါ်မည်
            const x = player.x + Math.cos(angle) * dist;
            const y = player.playerY + Math.sin(angle) * dist;
            const isTargetSpawn = Math.random() < 0.5;
            let chosenLetter = game.targetLetter;
            if (!isTargetSpawn) {
                const filtered = burmeseAlphabets.filter(char => char !== game.targetLetter);
                chosenLetter = filtered[Math.floor(Math.random() * filtered.length)];
            }
            entities.letterBubbles.push({
                x, y,
                letter: chosenLetter,
                scale: 1.0,
                spawnTime: Date.now() 
            });
        }

        setInterval(spawnLetterBubble, 850);

        function handleHitTarget() {
            playSound('hit');
            game.correctPops++;
            game.score += 10;
            player.currentLevelHits++;

            const reqHits = levelRequirements[player.level];

            if (player.currentLevelHits >= reqHits) {
                if (player.level < 3) {
                    player.level++;
                    player.currentLevelHits = 0;
                    playSound('win');
                } else {
                    // အဆင့် ၃ အထိ အောင်မြင်စွာ ပြီးဆုံးသွားသည့်ခါ
                    gameWin();
                    return;
                }
            }
            changeTargetLetter();
        }

        function gameWin() {
            game.running = false;
            playSound('win');
            document.getElementById('modal-title').innerText = "ဂုဏ်ယူပါတယ်!";
            document.getElementById('modal-subtitle').innerText = "အဆင့် ၁ မှ ၃ အထိ အောင်မြင်စွာ ပြီးဆုံးသွားပါပြီ။";
            document.getElementById('stat-coins').innerText = game.correctPops;
            document.getElementById('stat-kills').innerText = game.incorrectPops;
            document.getElementById('stat-level').innerText = "အဆင့် ၃ (ပြီးဆုံး)";
            document.getElementById('game-stats').classList.remove('hidden');
            document.getElementById('start-btn').innerText = "🔄 ပြန်လည်ကစားမည်";
            document.getElementById('overlay-screen').classList.remove('hidden');
        }

        let lastTime = performance.now();
        function updateGame(dt) {
            if (!game.running) return;
            let moveX = 0, moveY = 0;

            if (keys['w'] || keys['arrowup']) moveY = -1;
            if (keys['s'] || keys['arrowdown']) moveY = 1;
            if (keys['a'] || keys['arrowleft']) moveX = -1;
            if (keys['d'] || keys['arrowright']) moveX = 1;

            if (moveX !== 0 && moveY !== 0) { moveX *= 0.7071; moveY *= 0.7071; }

            player.x += moveX * player.speed * dt;
            player.playerY += moveY * player.speed * dt;

            if (moveX !== 0 || moveY !== 0) player.angle = Math.atan2(moveY, moveX) + Math.PI/2;

            const mapLimit = 1500;
            player.x = Math.max(-mapLimit, Math.min(mapLimit, player.x));
            player.playerY = Math.max(-mapLimit, Math.min(mapLimit, player.playerY));
            
            game.camera.x += (player.x - window.innerWidth / 2 - game.camera.x) * 0.1 * dt;
            game.camera.y += (player.playerY - window.innerHeight / 2 - game.camera.y) * 0.1 * dt;

            // Projectiles update
            for (let i = entities.projectiles.length - 1; i >= 0; i--) {
                const proj = entities.projectiles[i];
                proj.x += proj.vx * dt;
                proj.y += proj.vy * dt;

                let projectileHit = false;
                for (let j = entities.letterBubbles.length - 1; j >= 0; j--) {
                    const bubble = entities.letterBubbles[j];
                    const dx = bubble.x - proj.x;
                    const dy = bubble.y - proj.y;
                    if (Math.sqrt(dx * dx + dy * dy) < (18 * bubble.scale) + proj.radius) {
                        projectileHit = true;
                        if (bubble.letter === game.targetLetter) {
                            entities.letterBubbles.splice(j, 1);
                            handleHitTarget();
                        } else {
                            playSound('fail');
                            game.incorrectPops++;
                            entities.letterBubbles.splice(j, 1);
                        }
                        break;
                    }
                }
                if (projectileHit) entities.projectiles.splice(i, 1);
            }

            // Letter bubbles updates
            for (let idx = entities.letterBubbles.length - 1; idx >= 0; idx--) {
                const bubble = entities.letterBubbles[idx];
                if (Date.now() - bubble.spawnTime > 6000) {
                    entities.letterBubbles.splice(idx, 1);
                }
            }

            // UI Update
            const reqHits = levelRequirements[player.level];
            const progressPercent = (player.currentLevelHits / reqHits) * 100;
            document.getElementById('xp-bar').style.width = `${progressPercent}%`;
            document.getElementById('level-display').innerText = `အဆင့် ${player.level}`;
            document.getElementById('cash-display').innerText = game.score;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-game.camera.x, -game.camera.y);

            ctx.fillStyle = '#022c22';
            ctx.fillRect(player.x - 2000, player.playerY - 2000, 4000, 4000);

            entities.scenery.forEach(item => {
                if (item.type === 'flower') drawFlower(ctx, item.x, item.y, item.radius, item.color);
                else drawPillar(ctx, item.x, item.y, item.radius, item.color);
            });

            entities.projectiles.forEach(proj => {
                ctx.save();
                ctx.fillStyle = '#6ee7b7';
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            entities.letterBubbles.forEach(bubble => drawJungleTotem(ctx, bubble));
            drawPlayer(ctx, player.x, player.playerY);
            ctx.restore();
        }

        function gameLoop(now) {
            let dt = (now - lastTime) / 16.666;
            lastTime = now;
            if (dt > 4) dt = 4; 

            updateGame(dt);
            render();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            player.level = 1;
            player.currentLevelHits = 0;
            player.x = 0;
            player.playerY = 0;
            game.score = 0;
            game.correctPops = 0;
            game.incorrectPops = 0;
            entities.letterBubbles = [];
            entities.projectiles = [];
            
            initScenery();
            changeTargetLetter();
            
            document.getElementById('overlay-screen').classList.add('hidden');
            game.running = true;
        }

        function returnToMainPage() {
            game.running = false;
            window.location.href = 'index.html?fromGame=true'; 
        }

        document.getElementById('start-btn').onclick = startGame;
        document.getElementById('exit-btn').onclick = returnToMainPage;
        document.getElementById('main-page-btn').onclick = returnToMainPage;

        window.onload = function() {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
