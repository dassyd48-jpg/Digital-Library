<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ဠ အက္ခရာလေ့လာကြမယ်</title>
    <!-- Tailwind CSS for sleek UI overlay -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;700;900&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #451a03; /* Deep Canyon Earth */
            font-family: 'Fredoka One', 'Pyidaungsu', 'Montserrat', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .burmese-font {
            font-family: 'Pyidaungsu', 'Myanmar3', 'Yunghkio', sans-serif;
        }
    </style>
</head>
<body class="relative">

    <!-- Top Bar Container with HUD & Navigation Buttons -->
    <div class="absolute top-4 left-4 right-4 z-30 pointer-events-none flex flex-wrap items-start justify-between gap-2">
        
        <!-- Left Section: HUD / Learning Progress & Score Top Overlay -->
        <div id="hud" class="pointer-events-none flex flex-col space-y-2 max-w-md">
            <!-- Learning Progress Bar -->
            <div class="flex items-center space-x-3 bg-stone-950/90 backdrop-blur-md p-3 rounded-2xl border border-amber-600/20 shadow-lg">
                <span class="text-xs font-black text-amber-500 tracking-wider uppercase">Level Progress</span>
                <div class="flex-1 bg-black/40 h-4 rounded-full overflow-hidden p-0.5 border border-white/5">
                    <div id="xp-bar" class="bg-gradient-to-r from-amber-500 via-orange-600 to-yellow-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <span id="level-display" class="bg-stone-800 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Level 1</span>
            </div>
            
            <!-- Score Counter & Active Target Letter Display -->
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-2 bg-stone-950/90 backdrop-blur-md px-4 py-2 rounded-2xl border border-stone-500/20 shadow-lg">
                    <span class="text-xl">🦅</span>
                    <span id="cash-display" class="text-white font-black tracking-widest text-sm">0</span>
                </div>
                <!-- Dynamic Educational Goal Frame -->
                <div class="flex items-center space-x-2 bg-gradient-to-r from-orange-500/20 to-amber-500/20 backdrop-blur-md px-4 py-2 rounded-2xl border border-orange-500/40 shadow-lg">
                    <span class="text-xs font-black text-orange-400 uppercase tracking-wider">Target:</span>
                    <span id="target-letter-display" class="burmese-font text-xl font-bold text-orange-300">ဠ (0/10)</span>
                </div>
            </div>
        </div>

        <!-- Right Section: Navigation Buttons & Health Indicator -->
        <div class="flex flex-col items-end space-y-2 pointer-events-auto">
            <!-- Navigation Links -->
            <div class="flex space-x-2 pointer-events-auto">
                <a href="index.html?fromGame=true" class="px-3 py-2 bg-stone-950/90 hover:bg-stone-900 border border-amber-600/30 rounded-xl text-xs text-white flex items-center space-x-1 shadow-md transition-all active:scale-95 cursor-pointer">
                    <span>🏠</span> <span class="hidden sm:inline">ပင်မမြေပုံ</span>
                </a>
                <a href="index.html?fromGame=true&showPopup=stage3" class="px-3 py-2 bg-stone-950/90 hover:bg-stone-900 border border-orange-500/30 rounded-xl text-xs text-white flex items-center space-x-1 shadow-md transition-all active:scale-95 cursor-pointer">
                    <span>↩️</span> <span class="hidden sm:inline">နောက်သို့</span>
                </a>
            </div>

            <!-- Health Indicator -->
            <div class="flex items-center space-x-2 bg-stone-950/90 backdrop-blur-md px-4 py-2 rounded-2xl border border-stone-500/20 shadow-lg">
                <span class="text-lg">❤️</span>
                <span id="hp-display" class="text-orange-400 font-black tracking-wider text-sm">100 / 100</span>
            </div>
        </div>

    </div>

    <!-- Level Complete / Next Level Modal -->
    <div id="level-complete-modal" class="hidden absolute inset-0 bg-black/85 backdrop-blur-md z-[100] flex items-center justify-center p-6 transition-all duration-300">
        <div class="bg-[#451a03] border-2 border-orange-500/30 rounded-[2.5rem] p-8 max-w-md w-full text-center shadow-2xl flex flex-col items-center">
            <div class="text-5xl mb-4">🦅⛰️🎉</div>
            <h2 id="modal-title" class="burmese-font text-2xl font-bold text-orange-400 mb-2">Level 1 ပြီးမြောက်ပါပြီ!</h2>
            <p id="modal-desc" class="burmese-font text-stone-300 text-sm mb-6">နောက်တစ်ဆင့်သို့ တက်လှမ်းရန် အဆင်သင့်ဖြစ်ပါပြီ။</p>
            
            <button id="next-level-btn" class="burmese-font px-10 py-3.5 bg-orange-600 hover:bg-orange-500 text-white font-bold text-lg rounded-full transition-all shadow-lg border-b-4 border-orange-800 active:scale-95 pointer-events-auto">
                နောက်ထပ် level သို့သွားမယ်
            </button>
        </div>
    </div>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Start / GameOver Screens -->
    <div id="overlay-screen" class="absolute inset-0 bg-stone-950/95 backdrop-blur-md z-[90] flex flex-col items-center justify-center text-center p-8">
        <h1 class="burmese-font text-2xl sm:text-3xl font-bold text-orange-400 tracking-wide mb-3 drop-shadow-[0_0_20px_rgba(249,115,22,0.3)]">"ဠ" အက္ခရာလေ့လာခြင်း</h1>
        
        <div id="game-stats" class="hidden bg-white/5 border border-white/5 rounded-3xl p-6 mb-10 max-w-xs w-full text-left space-y-3 font-sans">
            <div class="flex justify-between"><span class="text-stone-300">Target Boulders Shattered</span><span id="stat-coins" class="text-white font-bold">0</span></div>
            <div class="flex justify-between"><span class="text-stone-300">Wrong Stones Avoided</span><span id="stat-kills" class="text-white font-bold">0</span></div>
            <div class="flex justify-between"><span class="text-stone-300">Canyon Altitude Height</span><span id="stat-level" class="text-orange-500 font-bold">Level 1</span></div>
        </div>

        <button id="start-btn" class="burmese-font px-14 py-4 bg-orange-600 hover:bg-orange-500 text-white font-bold text-xl rounded-full transition-all shadow-[0_10px_30px_rgba(249,115,22,0.3)] border-b-4 border-orange-800 active:scale-95 pointer-events-auto">စတင်မယ်</button>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(250, now + 0.1);
                gainNode.gain.setValueAtTime(0.03, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
                gainNode.gain.setValueAtTime(0.06, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(650, now);
                osc.frequency.setValueAtTime(1050, now + 0.05);
                gainNode.gain.setValueAtTime(0.04, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
                osc.start(now);
                osc.stop(now + 0.16);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.linearRampToValueAtTime(70, now + 0.28);
                gainNode.gain.setValueAtTime(0.08, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                osc.start(now);
                osc.stop(now + 0.28);
            } else if (type === 'levelup') {
                const freqs = [450, 580, 720, 950, 1300];
                freqs.forEach((f, i) => {
                    const oscSeq = audioCtx.createOscillator();
                    const gainSeq = audioCtx.createGain();
                    oscSeq.connect(gainSeq);
                    gainSeq.connect(audioCtx.destination);
                    oscSeq.type = 'sine';
                    oscSeq.frequency.setValueAtTime(f, now + i * 0.04);
                    gainSeq.gain.setValueAtTime(0.04, now + i * 0.04);
                    gainSeq.gain.exponentialRampToValueAtTime(0.01, now + i * 0.04 + 0.12);
                    oscSeq.start(now + i * 0.04);
                    oscSeq.stop(now + i * 0.04 + 0.12);
                });
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const burmeseAlphabets = [
            'က', 'ခ', 'ဂ', 'ဃ', 'င', 'စ', 'ဆ', 'ဇ', 'ဈ', 'ည',
            'တ', 'ဌ', 'ထ', 'ဒ', 'ဓ', 'န', 'ပ', 'ဖ', 'ဗ', 'ဘ', 'မ',
            'ယ', 'ရ', 'လ', 'ဝ', 'သ', 'ဟ', 'ဠ', 'အ', 'ဏ', 'ဎ'
        ];

        // Level အလိုက် ပစ်မှတ် အရေအတွက်များ (Level 1 = 10, Level 2 = 15, Level 3 = 20)
        const LEVEL_TARGETS = {
            1: 10,
            2: 15,
            3: 20
        };

        const game = {
            running: false,
            paused: false,
            score: 0,
            correctPops: 0,
            incorrectPops: 0,
            targetLetter: 'ဠ',
            levelHits: 0,
            currentLevel: 1,
            maxLevel: 3,
            camera: { x: 0, y: 0 }
        };

        const player = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            angle: 0,
            radius: 22, 
            hp: 100,
            maxHp: 100,
            speed: 5.8, 
            range: 350,         
            shootCooldown: 0.17, 
            lastShotTime: 0
        };

        const keys = {};
        const entities = {
            projectiles: [],
            letterBubbles: [], 
            collectibles: [],  
            scenery: []        
        };

        function initScenery() {
            entities.scenery = [];
            const mapRadius = 1600;

            for (let i = 0; i < 28; i++) {
                entities.scenery.push({
                    type: 'rock',
                    x: (Math.random() - 0.5) * mapRadius * 2,
                    y: (Math.random() - 0.5) * mapRadius * 2,
                    radius: 30 + Math.random() * 30,
                    color: Math.random() > 0.5 ? '#78350f' : '#b45309'
                });
            }

            for (let i = 0; i < 25; i++) {
                entities.scenery.push({
                    type: 'shrub',
                    x: (Math.random() - 0.5) * mapRadius * 2,
                    y: (Math.random() - 0.5) * mapRadius * 2,
                    radius: 12 + Math.random() * 8
                });
            }
        }

        function updateHUD() {
            const targetNeeded = LEVEL_TARGETS[game.currentLevel];
            document.getElementById('target-letter-display').innerText = `ဠ (${game.levelHits}/${targetNeeded})`;
            document.getElementById('level-display').innerText = `Level ${game.currentLevel}`;
            document.getElementById('cash-display').innerText = game.score;
            document.getElementById('hp-display').innerText = `${Math.max(0, Math.round(player.hp))} / ${player.maxHp}`;
            
            const progressPct = Math.min(100, (game.levelHits / targetNeeded) * 100);
            document.getElementById('xp-bar').style.width = `${progressPct}%`;
        }

        function checkLevelProgress() {
            const targetNeeded = LEVEL_TARGETS[game.currentLevel];
            
            if (game.levelHits >= targetNeeded) {
                playSound('levelup');
                game.paused = true;

                const modal = document.getElementById('level-complete-modal');
                const title = document.getElementById('modal-title');
                const desc = document.getElementById('modal-desc');
                const nextBtn = document.getElementById('next-level-btn');

                if (game.currentLevel < game.maxLevel) {
                    title.innerText = `Level ${game.currentLevel} ပြီးမြောက်ပါပြီ!`;
                    desc.innerText = `နောက်တစ်ဆင့် (Level ${game.currentLevel + 1}) သို့ တက်လှမ်းရန် အဆင်သင့်ဖြစ်ပါပြီ။`;
                    nextBtn.innerText = "နောက်ထပ် level သို့သွားမယ်";
                    nextBtn.onclick = () => {
                        game.currentLevel++;
                        game.levelHits = 0;
                        modal.classList.add('hidden');
                        game.paused = false;
                        updateHUD();
                    };
                } else {
                    title.innerText = "🎉 ဂုဏ်ပြုပါသည်!";
                    desc.innerText = "Level 3 စလုံးကို အောင်မြင်စွာ ပြီးဆုံးသွားပါပြီ။";
                    nextBtn.innerText = "ပြီးပြီ";
                    nextBtn.onclick = () => {
                        window.location.href = "index.html?fromGame=true&showPopup=stage3";
                    };
                }
                modal.classList.remove('hidden');
            }
        }

        function drawRock(ctx, x, y, radius, color) {
            ctx.save();
            ctx.translate(x, y);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(5, 8, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = color;
            ctx.beginPath();
            const points = 6;
            for (let i = 0; i < points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const offset = (i % 2 === 0 ? 1 : 0.8) * radius;
                const rx = Math.cos(angle) * offset;
                const ry = Math.sin(angle) * offset;
                if (i === 0) ctx.moveTo(rx, ry);
                else ctx.lineTo(rx, ry);
            }
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.restore();
        }

        function drawShrub(ctx, x, y, radius) {
            ctx.save();
            ctx.translate(x, y);
            ctx.strokeStyle = '#292524';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';

            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                const angle = -Math.PI/4 - (i * Math.PI/6);
                ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPlayer(ctx, x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(player.angle);

            const wingSwing = Math.sin(Date.now() * 0.018) * 14;

            // Left Long Feathery Wing
            ctx.fillStyle = '#451a03';
            ctx.beginPath();
            ctx.moveTo(-8, 2);
            ctx.lineTo(-32, -12 + wingSwing);
            ctx.lineTo(-20, 16 + wingSwing);
            ctx.closePath();
            ctx.fill();

            // Right Long Feathery Wing
            ctx.beginPath();
            ctx.moveTo(8, 2);
            ctx.lineTo(32, -12 + wingSwing);
            ctx.lineTo(20, 16 + wingSwing);
            ctx.closePath();
            ctx.fill();

            // Dark Tail Fan
            ctx.fillStyle = '#292524';
            ctx.fillRect(-6, 14, 12, 10);

            // Fluffy White Collar
            ctx.fillStyle = '#f5f5f4';
            ctx.beginPath();
            ctx.arc(0, -12, 10, 0, Math.PI * 2);
            ctx.fill();

            // Vulture Main Torso Body
            ctx.fillStyle = '#57534e'; 
            ctx.beginPath();
            ctx.ellipse(0, 2, 11, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            // Bald Pinkish Neck & Head
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(0, -18, 6, 0, Math.PI * 2);
            ctx.fill();

            // Sharp Curved Hooked Beak
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(-3, -20);
            ctx.lineTo(0, -31);
            ctx.lineTo(3, -20);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Thermal Wind Scope Loop
            ctx.strokeStyle = 'rgba(249, 115, 22, 0.15)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.arc(x, y, player.range, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawCursedBoulder(ctx, orb) {
            const { x, y, letter, scale } = orb;
            const isTarget = letter === game.targetLetter;

            ctx.save();
            ctx.translate(x, y);

            const bobbing = Math.sin(Date.now() * 0.0052 + orb.angleOffset) * 5;
            ctx.translate(0, bobbing);

            let rockColor = isTarget ? '#7c2d12' : '#44403c';
            let glowColor = isTarget ? 'rgba(249, 115, 22, 0.25)' : 'rgba(0, 0, 0, 0.1)';

            ctx.fillStyle = glowColor;
            ctx.beginPath();
            ctx.arc(0, 0, 24 * scale, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = rockColor;
            ctx.beginPath();
            const facets = 5;
            for (let i = 0; i < facets; i++) {
                const ang = (i / facets) * Math.PI * 2 + orb.angleOffset;
                const rad = 17 * scale * (i % 2 === 0 ? 1 : 0.85);
                const kx = Math.cos(ang) * rad;
                const ky = Math.sin(ang) * rad;
                if (i === 0) ctx.moveTo(kx, ky);
                else ctx.lineTo(kx, ky);
            }
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 11 * scale, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            ctx.save();
            ctx.translate(x, y + bobbing);
            ctx.fillStyle = isTarget ? '#451a03' : '#1c1917';
            ctx.font = `bold ${21 * scale}px Pyidaungsu, "Myanmar3", "Yunghkio", sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';
            ctx.fillText(letter, 0, 0);
            ctx.restore();
        }

        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        canvas.addEventListener('mousedown', (e) => {
            if (!game.running || game.paused) return;
            fireManualProjectile(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!game.running || game.paused) return;
            const touch = e.touches[0];
            fireManualProjectile(touch.clientX, touch.clientY);
        }, { passive: true });

        function fireManualProjectile(screenX, screenY) {
            const now = Date.now() / 1000;
            if (now - player.lastShotTime < player.shootCooldown) return;

            const worldX = screenX + game.camera.x;
            const worldY = screenY + game.camera.y;

            const dx = worldX - player.x;
            const dy = worldY - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist === 0) return;

            playSound('shoot');
            entities.projectiles.push({
                x: player.x,
                y: player.y,
                vx: (dx / dist) * 15.5, 
                vy: (dy / dist) * 15.5,
                radius: 5
            });

            player.lastShotTime = now;
        }

        function spawnLetterBubble() {
            if (!game.running || game.paused) return;

            const angle = Math.random() * Math.PI * 2;
            // ပစ်မှတ်များကို အနီးအနားတွင် ပေါ်လာစေရန် အကွာအဝေးကို လျှော့ချထားပါသည် (120 မှ 250 pixels)
            const dist = 120 + Math.random() * 130;
            const x = player.x + Math.cos(angle) * dist;
            const y = player.y + Math.sin(angle) * dist;

            const isTargetSpawn = Math.random() < 0.45;
            let chosenLetter = 'ဠ'; 
            if (!isTargetSpawn) {
                const filtered = burmeseAlphabets.filter(char => char !== 'ဠ');
                chosenLetter = filtered[Math.floor(Math.random() * filtered.length)];
            }

            entities.letterBubbles.push({
                x,
                y,
                letter: chosenLetter,
                scale: 1.0 + Math.random() * 0.22,
                speed: 0.55 + Math.random() * 0.55, 
                angleOffset: Math.random() * Math.PI * 2,
                hp: 1,
                spawnTime: Date.now() 
            });
        }

        setInterval(spawnLetterBubble, 860);

        let lastTime = performance.now();

        function updateGame(dt) {
            if (!game.running || game.paused) return;

            let moveX = 0;
            let moveY = 0;

            if (keys['w'] || keys['arrowup']) moveY = -1;
            if (keys['s'] || keys['arrowdown']) moveY = 1;
            if (keys['a'] || keys['arrowleft']) moveX = -1;
            if (keys['d'] || keys['arrowright']) moveX = 1;

            if (moveX !== 0 && moveY !== 0) {
                moveX *= 0.7071;
                moveY *= 0.7071;
            }

            player.x += moveX * player.speed * dt;
            player.y += moveY * player.speed * dt;

            if (moveX !== 0 || moveY !== 0) {
                player.angle = Math.atan2(moveY, moveX) + Math.PI/2;
            }

            const mapLimit = 1500;
            player.x = Math.max(-mapLimit, Math.min(mapLimit, player.x));
            player.y = Math.max(-mapLimit, Math.min(mapLimit, player.y));

            game.camera.x += (player.x - window.innerWidth / 2 - game.camera.x) * 0.1 * dt;
            game.camera.y += (player.y - window.innerHeight / 2 - game.camera.y) * 0.1 * dt;

            for (let i = entities.projectiles.length - 1; i >= 0; i--) {
                const proj = entities.projectiles[i];
                proj.x += proj.vx * dt;
                proj.y += proj.vy * dt;

                const flightDistance = Math.sqrt((proj.x - player.x) ** 2 + (proj.y - player.y) ** 2);
                if (flightDistance > player.range + 200) {
                    entities.projectiles.splice(i, 1);
                    continue;
                }

                let projectileHit = false;

                for (let j = entities.letterBubbles.length - 1; j >= 0; j--) {
                    const bubble = entities.letterBubbles[j];
                    const dx = bubble.x - proj.x;
                    const dy = bubble.y - proj.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < (18 * bubble.scale) + proj.radius) {
                        projectileHit = true;
                        
                        if (bubble.letter === game.targetLetter) {
                            playSound('hit');
                            entities.letterBubbles.splice(j, 1);
                            
                            game.correctPops++;
                            game.levelHits++;
                            game.score += 15;

                            entities.collectibles.push({
                                x: bubble.x,
                                y: bubble.y,
                                value: 25
                            });

                            checkLevelProgress();
                        } else {
                            playSound('fail');
                            game.incorrectPops++;
                            entities.letterBubbles.splice(j, 1);
                            player.hp = Math.max(0, player.hp - 5);
                            if (player.hp <= 0) gameOver();
                        }
                        break; 
                    }
                }

                if (projectileHit) {
                    entities.projectiles.splice(i, 1);
                }
            }

            for (let idx = entities.letterBubbles.length - 1; idx >= 0; idx--) {
                const bubble = entities.letterBubbles[idx];

                if (bubble.letter !== game.targetLetter && (Date.now() - bubble.spawnTime > 5000)) {
                    entities.letterBubbles.splice(idx, 1);
                    continue;
                }

                const driftTime = Date.now() * 0.001 + bubble.angleOffset;
                bubble.x += Math.sin(driftTime * 1.15) * 0.58 * dt;
                bubble.y += Math.cos(driftTime * 0.45) * 0.58 * dt;

                const dx = player.x - bubble.x;
                const dy = player.y - bubble.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.radius + 15) {
                    if (bubble.letter === game.targetLetter) {
                        playSound('coin');
                        game.correctPops++;
                        game.levelHits++;
                        game.score += 25;
                        entities.letterBubbles.splice(idx, 1);
                        checkLevelProgress();
                    } else {
                        playSound('fail');
                        entities.letterBubbles.splice(idx, 1);
                        player.hp = Math.max(0, player.hp - 10);
                        if (player.hp <= 0) gameOver();
                    }
                }

                if (Math.abs(bubble.y - player.y) > 600 || Math.abs(bubble.x - player.x) > 800) {
                    entities.letterBubbles.splice(idx, 1);
                }
            }

            for (let i = entities.collectibles.length - 1; i >= 0; i--) {
                const item = entities.collectibles[i];
                const dx = player.x - item.x;
                const dy = player.y - item.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < player.range) {
                    item.x += (dx / dist) * 7.8 * dt;
                    item.y += (dy / dist) * 7.8 * dt;
                }

                if (dist < player.radius + 10) {
                    playSound('coin');
                    entities.collectibles.splice(i, 1);
                }
            }

            updateHUD();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-game.camera.x, -game.camera.y);

            ctx.fillStyle = '#292524'; 
            ctx.fillRect(player.x - 2000, player.y - 2000, 4000, 4000);

            entities.scenery.forEach(item => {
                if (item.type === 'shrub') drawShrub(ctx, item.x, item.y, item.radius);
            });

            entities.scenery.forEach(item => {
                if (item.type === 'rock') drawRock(ctx, item.x, item.y, item.radius, item.color);
            });

            entities.collectibles.forEach(item => {
                ctx.save();
                ctx.fillStyle = '#fed7aa'; 
                ctx.shadowColor = '#f97316';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(item.x, item.y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            entities.projectiles.forEach(proj => {
                ctx.save();
                ctx.fillStyle = '#ffedd5';
                ctx.shadowColor = '#fb923c';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.ellipse(proj.x, proj.y, proj.radius * 1.8, proj.radius * 0.6, Math.atan2(proj.vy, proj.vx), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            entities.letterBubbles.forEach(bubble => drawCursedBoulder(ctx, bubble));

            drawPlayer(ctx, player.x, player.y);

            ctx.restore();
        }

        function gameLoop(now) {
            let dt = (now - lastTime) / 16.666;
            lastTime = now;
            if (dt > 4) dt = 4; 

            updateGame(dt);
            render();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            player.hp = player.maxHp;
            player.x = 0;
            player.y = 0;
            player.angle = 0;
            game.score = 0;
            game.correctPops = 0;
            game.incorrectPops = 0;
            game.levelHits = 0;
            game.currentLevel = 1;
            game.paused = false;
            entities.letterBubbles = [];
            entities.projectiles = [];
            entities.collectibles = [];
            
            initScenery();
            updateHUD();
            
            document.getElementById('overlay-screen').classList.add('hidden');
            document.getElementById('game-stats').classList.add('hidden');
            document.getElementById('level-complete-modal').classList.add('hidden');
            game.running = true;
        }

        function gameOver() {
            game.running = false;
            document.getElementById('stat-coins').innerText = game.correctPops;
            document.getElementById('stat-kills').innerText = game.incorrectPops;
            document.getElementById('stat-level').innerText = `Level ${game.currentLevel}`;
            document.getElementById('game-stats').classList.remove('hidden');
            document.getElementById('start-btn').innerText = "ပြန်စမယ်";
            document.getElementById('overlay-screen').classList.remove('hidden');
        }

        document.getElementById('start-btn').onclick = startGame;

        window.onload = function() {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
