<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burmese Alphabet Hide & Seek - Lesson 7 (Space Exploration)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+Myanmar:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; user-select: none; }
    
    body {
      font-family: 'Fredoka', 'Noto Sans Myanmar', system-ui, sans-serif;
      background: linear-gradient(to bottom, #1a237e 0%, #311b92 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 10px;
    }

    /* ==========================================================================
       TOP NAVIGATION & HEADER PANEL
       ========================================================================= */
    .top-nav {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 800px;
      margin-bottom: 10px;
      z-index: 50;
      flex-wrap: nowrap;
    }
    
    .nav-btn {
      background: rgba(255, 255, 255, 0.9); border: 2px solid #673ab7; color: #4a148c;
      padding: 6px 14px; border-radius: 12px; font-weight: 700; font-size: 13px;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 4px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: all 0.2s; white-space: nowrap;
    }
    .nav-btn:active { transform: scale(0.95); }

    .header-panel {
      width: 100%; max-width: 800px; background: white; border: 4px solid #673ab7;
      border-radius: 20px; padding: 10px 16px; display: flex; align-items: center;
      justify-content: space-between; box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      z-index: 10; margin-bottom: 10px; gap: 8px; flex-wrap: wrap;
    }
    .instruction { font-size: 18px; font-weight: 700; color: #4a148c; display: flex; align-items: center; gap: 8px; }
    .target-box {
      font-family: 'Noto Sans Myanmar', sans-serif; font-size: 30px; font-weight: 900;
      color: white; background: #673ab7; padding: 2px 20px; border-radius: 14px;
      box-shadow: 0 4px 0 #4a148c; animation: pulseTarget 1s infinite alternate;
    }
    @keyframes pulseTarget { 0% { transform: scale(1); } 100% { transform: scale(1.06); } }
    
    .status-group { display: flex; align-items: center; gap: 12px; }
    .level-badge { font-size: 14px; font-weight: 900; background: #e1bee7; color: #4a148c; padding: 4px 12px; border-radius: 12px; }
    .score-stars { font-size: 20px; color: #ffb300; letter-spacing: 2px; }

    /* ==========================================================================
       GAME STAGE (SPACE ARENA)
       ========================================================================= */
    .game-stage {
      position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/10;
      background: linear-gradient(to bottom, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
      border: 6px solid #673ab7; border-radius: 24px; overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .moon-floor {
      position: absolute; bottom: 0; left: 0; right: 0; height: 22%;
      background: #778da9; z-index: 3; border-top: 4px solid #93a8c1;
      border-radius: 30% 30% 0 0 / 12px 12px 0 0;
      box-shadow: inset 0 8px 12px rgba(0,0,0,0.1);
    }

    .space-orbit {
      position: absolute; top: -10%; left: -10%; width: 60%; aspect-ratio: 1;
      border: 2px dashed rgba(255,255,255,0.1); border-radius: 50%; pointer-events: none;
    }
    .space-orbit-2 {
      position: absolute; top: 10%; right: -20%; width: 70%; aspect-ratio: 1;
      border: 2px dashed rgba(255,255,255,0.08); border-radius: 50%; pointer-events: none;
    }

    .star-twinkle {
      position: absolute; background: white; border-radius: 50%;
      animation: flashStar 2s infinite alternate; pointer-events: none;
    }
    @keyframes flashStar { 0% { opacity: 0.2; } 100% { opacity: 1; } }

    /* ==========================================================================
       HIDING SLOTS & SCENERY GRAPHICS
       ========================================================================= */
    .spot-container { position: absolute; z-index: 5; cursor: pointer; }
    .object-layer { position: absolute; inset: 0; z-index: 7; pointer-events: none; }

    /* 1. Space Rocket */
    .spot-rocket { bottom: 12%; left: 4%; width: 130px; height: 180px; }
    .rocket-cone { position: absolute; top: 0; left: 45px; width: 40px; height: 40px; background: #e53935; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
    .rocket-body { position: absolute; top: 38px; left: 45px; width: 40px; height: 100px; background: #eceff1; border-radius: 0 0 10px 10px; box-shadow: inset -8px 0 0 #cfd8dc; }
    .rocket-window { position: absolute; top: 55px; left: 53px; width: 24px; height: 24px; background: #80deea; border: 4px solid #78909c; border-radius: 50%; z-index: 8; }
    .rocket-fin-l { position: absolute; bottom: 42px; left: 25px; width: 22px; height: 45px; background: #e53935; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
    .rocket-fin-r { position: absolute; bottom: 42px; right: 25px; width: 22px; height: 45px; background: #e53935; clip-path: polygon(0 0, 100% 100%, 0 100%); }

    /* 2. Asteroid Rock */
    .spot-asteroid { bottom: 14%; left: 28%; width: 120px; height: 100px; }
    .ast-rock { position: absolute; inset: 0; background: #5c677d; border-radius: 40% 50% 35% 45% / 40% 35% 55% 45%; border: 4px solid #4a5265; box-shadow: inset -12px -8px 0 #333a42; }
    .ast-crater { position: absolute; background: #3d4554; border-radius: 50%; }
    .ac-1 { top: 20px; left: 25px; width: 20px; height: 16px; }
    .ac-2 { bottom: 25px; right: 25px; width: 24px; height: 18px; }

    /* 3. Saturn Planet */
    .spot-saturn { bottom: 22%; left: 48%; width: 150px; height: 110px; }
    .sat-sphere { position: absolute; top: 15px; left: 35px; width: 80px; height: 80px; background: #f06292; border-radius: 50%; box-shadow: inset -12px -8px 0 #d81b60; z-index: 2; }
    .sat-ring { 
      position: absolute; top: 42px; left: 0; width: 150px; height: 26px; 
      border: 10px solid #ffb74d; border-radius: 50%; transform: rotate(-12deg); z-index: 8; 
    }
    .sat-ring-back { position: absolute; top: 42px; left: 0; width: 150px; height: 26px; border: 10px solid #ffb74d; border-radius: 50%; transform: rotate(-12deg); z-index: 1; }

    /* 4. UFO */
    .spot-ufo { bottom: 24%; right: 22%; width: 140px; height: 90px; }
    .ufo-dome { position: absolute; top: 0; left: 40px; width: 60px; height: 50px; background: rgba(128, 222, 234, 0.7); border: 4px solid #00bcd4; border-radius: 50% 50% 0 0; z-index: 8; }
    .ufo-hull { position: absolute; bottom: 15px; left: 0; width: 140px; height: 35px; background: #b0bec5; border: 4px solid #78909c; border-radius: 50%; box-shadow: inset 0 -6px 0 #607d8b; z-index: 2; }
    .ufo-lights { position: absolute; bottom: 22px; left: 15px; right: 15px; display: flex; justify-content: space-around; z-index: 3; }
    .ufo-glow { width: 8px; height: 8px; background: #ffeb3b; border-radius: 50%; animation: blinkGlow 0.5s infinite alternate; }
    @keyframes blinkGlow { 0% { opacity: 0.3; } 100% { opacity: 1; } }

    /* 5. Moon Crater */
    .spot-crater { bottom: 6%; right: 2%; width: 140px; height: 85px; }
    .crater-rim { position: absolute; bottom: 0; left: 0; width: 140px; height: 60px; background: #64748b; border: 4px solid #475569; border-radius: 50%; box-shadow: inset 0 -8px 0 #334155; }
    .crater-pit { position: absolute; top: 8px; left: 18px; width: 104px; height: 36px; background: #1e293b; border-radius: 50%; }

    /* ==========================================================================
       CHARACTER SYSTEM
       ========================================================================= */
    .kid-character {
      position: absolute; width: 70px; height: 100px; display: flex; flex-direction: column; align-items: center;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.25); z-index: 4; pointer-events: none;
    }
    
    .spot-rocket .kid-character { left: 30px; bottom: 60px; }
    .spot-asteroid .kid-character { left: 25px; bottom: 10px; }
    .spot-saturn .kid-character { left: 40px; bottom: 5px; }
    .spot-ufo .kid-character { left: 35px; bottom: 12px; }
    .spot-crater .kid-character { left: 35px; bottom: 5px; }

    .held-letter {
      position: absolute; top: -46px; left: 50%; transform: translateX(-50%) scale(0);
      font-family: 'Noto Sans Myanmar', sans-serif; font-size: 26px; font-weight: 900;
      background: #f3e5f5; color: #4a148c; border: 3px solid #673ab7;
      padding: 2px 14px; border-radius: 14px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3); line-height: 1.2; z-index: 10;
    }
    .held-letter::after {
      content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
      border-width: 8px 8px 0; border-style: solid; border-color: #673ab7 transparent; display: block; width: 0;
    }

    .kid-head { width: 42px; height: 42px; background: #fbe9e7; border-radius: 50%; position: relative; border: 2px solid #263238; z-index: 5; }
    .kid-hair { position: absolute; top: -2px; left: -2px; right: -2px; height: 12px; background: #ffb74d; border-radius: 20px 20px 0 0; }
    .kid-eyes { position: absolute; top: 16px; left: 8px; right: 8px; display: flex; justify-content: space-between; }
    .kid-eyes::before, .kid-eyes::after { content: ''; width: 6px; height: 6px; background: #263238; border-radius: 50%; }
    .kid-smile { position: absolute; bottom: 6px; left: 16px; width: 10px; height: 6px; border-bottom: 2px solid #263238; border-radius: 0 0 5px 5px; }
    .kid-space-helm { position: absolute; inset: -5px; border: 3px solid #cfd8dc; background: rgba(224, 247, 250, 0.3); border-radius: 50%; z-index: 6; box-shadow: inset 0 4px 6px rgba(255,255,255,0.6); }

    .kid-body { 
      width: 36px; height: 42px; background: #ffffff; border-radius: 8px 8px 4px 4px; margin-top: -2px; position: relative; z-index: 4;
      opacity: 0; transform: translateY(10px); transition: opacity 0.3s ease, transform 0.3s ease;
      border: 2px solid #263238; border-bottom: none;
    }
    .kid-body::before { content: ''; position: absolute; top: 8px; left: 6px; width: 8px; height: 8px; background: #673ab7; border-radius: 50%; }

    .spot-rocket.peek .kid-character { transform: translateY(-45px); }
    .spot-asteroid.peek .kid-character { transform: translateY(-60px); }
    .spot-saturn.peek .kid-character { transform: translateX(-45px) translateY(-25px); }
    .spot-ufo.peek .kid-character { transform: translateY(-40px); }
    .spot-crater.peek .kid-character { transform: translateY(-58px); }

    .spot-container.peek .held-letter { transform: translateX(-50%) scale(1); }
    .spot-container.peek .kid-body { opacity: 1; transform: translateY(0); }

    .spot-rocket.success .kid-character { animation: spaceFloatRK 0.6s infinite alternate ease-in-out; }
    @keyframes spaceFloatRK { 0% { transform: translateY(-45px); } 100% { transform: translateY(-65px); } }

    .spot-asteroid.success .kid-character { animation: spaceFloatAST 0.6s infinite alternate ease-in-out; }
    @keyframes spaceFloatAST { 0% { transform: translateY(-60px); } 100% { transform: translateY(-80px); } }

    .spot-saturn.success .kid-character { animation: spaceFloatSAT 0.6s infinite alternate ease-in-out; }
    @keyframes spaceFloatSAT { 0% { transform: translateX(-45px) translateY(-25px); } 100% { transform: translateX(-45px) translateY(-45px); } }

    .spot-ufo.success .kid-character { animation: spaceFloatUFO 0.6s infinite alternate ease-in-out; }
    @keyframes spaceFloatUFO { 0% { transform: translateY(-40px); } 100% { transform: translateY(-60px); } }

    .spot-crater.success .kid-character { animation: spaceFloatCRT 0.6s infinite alternate ease-in-out; }
    @keyframes spaceFloatCRT { 0% { transform: translateY(-58px); } 100% { transform: translateY(-78px); } }

    .spot-container.success .kid-body { opacity: 1; transform: translateY(0); }

    .spot-rocket.wrong .kid-character { animation: wobbleRK 0.4s ease; }
    @keyframes wobbleRK { 0%, 100% { transform: translateY(-45px); } 25% { transform: translateX(-6px) translateY(-45px); } 75% { transform: translateX(6px) translateY(-45px); } }

    .spot-asteroid.wrong .kid-character { animation: wobbleAST 0.4s ease; }
    @keyframes wobbleAST { 0%, 100% { transform: translateY(-60px); } 25% { transform: translateX(-6px) translateY(-60px); } 75% { transform: translateX(6px) translateY(-60px); } }

    .spot-saturn.wrong .kid-character { animation: wobbleSAT 0.4s ease; }
    @keyframes wobbleSAT { 0%, 100% { transform: translateX(-45px) translateY(-25px); } 25% { transform: translateX(-51px) translateY(-25px); } 75% { transform: translateX(-39px) translateY(-25px); } }

    .spot-ufo.wrong .kid-character { animation: wobbleUFO 0.4s ease; }
    @keyframes wobbleUFO { 0%, 100% { transform: translateY(-40px); } 25% { transform: translateX(-6px) translateY(-40px); } 75% { transform: translateX(6px) translateY(-40px); } }

    .spot-crater.wrong .kid-character { animation: wobbleCRT 0.4s ease; }
    @keyframes wobbleCRT { 0%, 100% { transform: translateY(-58px); } 25% { transform: translateX(-6px) translateY(-58px); } 75% { transform: translateX(6px) translateY(-58px); } }

    /* ==========================================================================
       MODALS & OVERLAYS
       ========================================================================= */
    .intro-screen {
      position: absolute; inset: 0; 
      background: linear-gradient(to bottom, #2e1a47 0%, #110726 100%);
      z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; transition: opacity 0.4s ease, pointer-events 0.4s;
    }
    .intro-screen.hide { opacity: 0; pointer-events: none; }
    .intro-title { font-family: 'Noto Sans Myanmar', sans-serif; font-size: 36px; font-weight: 900; color: #b388ff; margin-bottom: 12px; }
    .intro-badge { font-family: 'Fredoka', 'Noto Sans Myanmar', sans-serif; background: #673ab7; color: white; padding: 6px 24px; border-radius: 20px; font-weight: 700; margin-bottom: 24px; box-shadow: 0 4px 0 #4a148c; font-size: 18px; }
    
    .btn-action {
      font-family: 'Noto Sans Myanmar', sans-serif; padding: 12px 48px; font-size: 20px; font-weight: 900;
      color: white; background: #673ab7; border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 6px 0 #4a148c; z-index: 5;
    }
    .btn-action:active { transform: translateY(3px); box-shadow: 0 3px 0 #4a148c; }

    .reward-backdrop {
      position: absolute; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 200; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .reward-backdrop.show { opacity: 1; pointer-events: auto; }
    .reward-box {
      background: white; border: 5px solid #ffca28; border-radius: 24px; padding: 30px 25px;
      width: 90%; max-width: 420px; text-align: center; transform: scale(0.7); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.25);
    }
    .reward-backdrop.show .reward-box { transform: scale(1); }
    .reward-title { font-family: 'Noto Sans Myanmar', sans-serif; font-size: 26px; font-weight: 900; color: #ff6f00; margin-bottom: 10px; }
    .reward-letter-display { font-family: 'Noto Sans Myanmar', sans-serif; font-size: 60px; font-weight: 900; color: #673ab7; margin: 8px 0; }
  </style>
</head>
<body>

  <!-- TOP NAVIGATION BUTTONS -->
  <div class="top-nav">
      <a href="index.html?fromGame=true" class="nav-btn" title="ပင်မစာမျက်နှာ">🏠 ပင်မ</a>
      <button class="nav-btn" onclick="goToWelcomeScreen()" title="နောက်သို့">↩️ back</button>
      <button class="nav-btn" id="bgmToggleBtn" onclick="toggleBGM()">🎵 BGM: ON</button>
  </div>

  <div class="header-panel">
    <div class="instruction">
      <span>သူငယ်ချင်းတို့ဆီက</span>
      <div class="target-box" id="targetDisplay">ဟ</div>
      <span>ကို ရှာပေးပါဦး။</span>
    </div>
    <div class="status-group">
      <div class="level-badge" id="levelDisplay">Level 1</div>
      <div class="score-stars" id="starContainer">☆☆☆</div>
    </div>
  </div>

  <div class="game-stage">
    
    <div class="star-twinkle" style="top:15%; left:12%; width:4px; height:4px; animation-duration:1.2s;"></div>
    <div class="star-twinkle" style="top:40%; left:35%; width:5px; height:5px; animation-duration:1.8s;"></div>
    <div class="star-twinkle" style="top:20%; right:40%; width:3px; height:3px; animation-duration:1.5s;"></div>
    <div class="star-twinkle" style="top:12%; right:15%; width:6px; height:6px; animation-duration:2.2s;"></div>
    <div class="star-twinkle" style="top:55%; right:10%; width:4px; height:4px; animation-duration:1.3s;"></div>

    <div class="space-orbit"></div>
    <div class="space-orbit-2"></div>
    <div class="moon-floor"></div>
    
    <div class="spot-container spot-rocket" onclick="handleSpotClick(0)">
      <div class="kid-character" id="kid0">
        <div class="held-letter" id="letter0">-</div>
        <div class="kid-head"><div class="kid-space-helm"></div><div class="kid-hair"></div><div class="kid-eyes"></div><div class="kid-smile"></div></div>
        <div class="kid-body"></div>
      </div>
      <div class="object-layer">
        <div class="rocket-cone"></div>
        <div class="rocket-fin-l"></div>
        <div class="rocket-fin-r"></div>
        <div class="rocket-body"></div>
        <div class="rocket-window"></div>
      </div>
    </div>

    <div class="spot-container spot-asteroid" onclick="handleSpotClick(1)">
      <div class="kid-character" id="kid1">
        <div class="held-letter" id="letter1">-</div>
        <div class="kid-head"><div class="kid-space-helm"></div><div class="kid-hair" style="background:#5d4037;"></div><div class="kid-eyes"></div><div class="kid-smile"></div></div>
        <div class="kid-body"></div>
      </div>
      <div class="object-layer">
        <div class="ast-rock"></div>
        <div class="ast-crater ac-1"></div>
        <div class="ast-crater ac-2"></div>
      </div>
    </div>

    <div class="spot-container spot-saturn" onclick="handleSpotClick(2)">
      <div class="kid-character" id="kid2">
        <div class="held-letter" id="letter2">-</div>
        <div class="kid-head"><div class="kid-space-helm"></div><div class="kid-hair" style="background:#264653;"></div><div class="kid-eyes"></div><div class="kid-smile"></div></div>
        <div class="kid-body"></div>
      </div>
      <div class="object-layer">
        <div class="sat-ring-back"></div>
        <div class="sat-sphere"></div>
        <div class="sat-ring"></div>
      </div>
    </div>

    <div class="spot-container spot-ufo" onclick="handleSpotClick(3)">
      <div class="kid-character" id="kid3">
        <div class="held-letter" id="letter3">-</div>
        <div class="kid-head"><div class="kid-space-helm"></div><div class="kid-hair" style="background:#6d4c41;"></div><div class="kid-eyes"></div><div class="kid-smile"></div></div>
        <div class="kid-body"></div>
      </div>
      <div class="object-layer">
        <div class="ufo-hull"></div>
        <div class="ufo-lights">
          <div class="ufo-glow"></div>
          <div class="ufo-glow" style="animation-delay:0.2s;"></div>
          <div class="ufo-glow" style="animation-delay:0.4s;"></div>
        </div>
        <div class="ufo-dome"></div>
      </div>
    </div>

    <div class="spot-container spot-crater" onclick="handleSpotClick(4)">
      <div class="kid-character" id="kid4">
        <div class="held-letter" id="letter4">-</div>
        <div class="kid-head"><div class="kid-space-helm"></div><div class="kid-hair" style="background:#1d3557;"></div><div class="kid-eyes"></div><div class="kid-smile"></div></div>
        <div class="kid-body"></div>
      </div>
      <div class="object-layer">
        <div class="crater-rim"></div>
        <div class="crater-pit"></div>
      </div>
    </div>

  </div>

  <div class="intro-screen" id="welcomePanel">
    <h1 class="intro-title">အက္ခရာသူငယ်ချင်းတို့ တူတူပုန်းတမ်း</h1>
    <div class="intro-badge">ဟ ၊ ဠ ၊ အ</div>
    <button class="btn-action" onclick="startGame()">ဂိမ်းစတင်ဆော့မည်</button>
  </div>

  <div class="reward-backdrop" id="rewardPanel">
    <div class="reward-box">
      <h2 class="reward-title" id="rewardTitle">🎉 အောင်မြင်စွာ ရှာဖွေနိုင်ခဲ့ပါပြီ! 🎉</h2>
      <p style="font-family:'Noto Sans Myanmar'; color:#546e7a;" id="rewardSub">သူငယ်ချင်းလေးဆီက ရှာတွေ့လိုက်တဲ့ အက္ခရာကတော့ -</p>
      <div class="reward-letter-display" id="rewardLetterBox">ဟ</div>
      <button class="btn-action" id="rewardBtn" style="background:#ff9800; box-shadow:0 6px 0 #e65100; margin-top: 10px;" onclick="advanceToNextRound()">နောက်ထပ် အက္ခရာအသစ် ရှာမည်</button>
    </div>
  </div>

  <script>
    // Navigation Functions
    function goToWelcomeScreen() {
      document.getElementById('welcomePanel').classList.remove('hide');
    }

    // 1. Web Audio API synthesized background music
    let audioCtx = null;
    let bgmIsPlaying = false;
    let bgmTimer = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playNote(freq, type, duration, delay = 0) {
      if (!audioCtx || !bgmIsPlaying) return;
      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
      }, delay);
    }

    function startBGM() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      bgmIsPlaying = true;
      document.getElementById('bgmToggleBtn').innerText = "🎵 BGM: ON";
      
      const melody = [
        {f: 523.25, d: 200}, {f: 659.25, d: 200}, {f: 783.99, d: 200}, {f: 1046.50, d: 400},
        {f: 880.00, d: 200}, {f: 783.99, d: 200}, {f: 659.25, d: 400},
        {f: 587.33, d: 200}, {f: 659.25, d: 200}, {f: 698.46, d: 200}, {f: 880.00, d: 400},
        {f: 783.99, d: 200}, {f: 659.25, d: 200}, {f: 523.25, d: 600}
      ];

      function loopMelody() {
        if (!bgmIsPlaying) return;
        let currentTime = 0;
        melody.forEach(note => {
          playNote(note.f, 'sine', note.d / 1000, currentTime);
          currentTime += note.d + 50;
        });
        bgmTimer = setTimeout(loopMelody, currentTime + 300);
      }

      loopMelody();
    }

    function toggleBGM() {
      if (bgmIsPlaying) {
        bgmIsPlaying = false;
        clearTimeout(bgmTimer);
        document.getElementById('bgmToggleBtn').innerText = "🔇 BGM: OFF";
      } else {
        startBGM();
      }
    }

    // Sound FX
    function playSFX(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.2);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    // 2. Game Logic Systems
    const targetOrder = ['ဟ', 'ဠ', 'အ'];
    const distractorPool = ['ဣ', 'ဤ', 'ဥ', 'ဦ', 'ဧ'];
    
    let currentLevel = 1;      // 1, 2, 3
    let currentRound = 0;      // Rounds within current level
    let targetIndex = 0;       // Points to targetOrder ('ဟ', 'ဠ', 'အ')
    let currentTargetLetter = '';
    let assignedPositions = [];
    let isTransitioning = false;

    function startGame() {
      document.getElementById('welcomePanel').classList.add('hide');
      currentLevel = 1;
      currentRound = 0;
      targetIndex = 0;
      
      startBGM();
      setupNewTargetRound();
    }

    function setupNewTargetRound() {
      isTransitioning = false;
      currentTargetLetter = targetOrder[targetIndex];
      
      let selection = [currentTargetLetter];
      let availableDistractors = [...distractorPool];
      
      targetOrder.forEach(l => {
        if (l !== currentTargetLetter && Math.random() < 0.5) selection.push(l);
      });

      while (selection.length < 5) {
        let randIdx = Math.floor(Math.random() * availableDistractors.length);
        selection.push(availableDistractors.splice(randIdx, 1)[0]);
      }

      assignedPositions = [];
      while (selection.length > 0) {
        let randIdx = Math.floor(Math.random() * selection.length);
        assignedPositions.push(selection.splice(randIdx, 1)[0]);
      }

      for(let i = 0; i < 5; i++) {
        document.getElementById(`letter${i}`).textContent = assignedPositions[i];
        const parentElementNode = document.getElementById(`kid${i}`).parentElement;
        parentElementNode.classList.remove('peek', 'success', 'wrong');
      }
      
      renderDashboardUI();
    }

    function renderDashboardUI() {
      document.getElementById('targetDisplay').textContent = currentTargetLetter;
      document.getElementById('levelDisplay').textContent = `Level ${currentLevel}`;
      
      let starMarkup = '';
      let starsInLevel = currentRound % 3;
      for(let i = 0; i < 3; i++) {
        starMarkup += (i < starsInLevel) ? '★' : '☆';
      }
      document.getElementById('starContainer').textContent = starMarkup;
    }

    function handleSpotClick(spotIndex) {
      if(isTransitioning) return;
      
      isTransitioning = true;
      const clickedSpotContainer = document.getElementById(`kid${spotIndex}`).parentElement;
      const discoveredLetter = assignedPositions[spotIndex];

      clickedSpotContainer.classList.remove('wrong', 'peek', 'success');
      void clickedSpotContainer.offsetWidth;
      clickedSpotContainer.classList.add('peek');

      setTimeout(() => {
        if(discoveredLetter === currentTargetLetter) {
          playSFX('correct');
          clickedSpotContainer.classList.remove('peek');
          clickedSpotContainer.classList.add('success');
          
          document.getElementById('rewardLetterBox').textContent = currentTargetLetter;
          currentRound++;
          targetIndex = (targetIndex + 1) % targetOrder.length;
          
          setTimeout(() => {
            showRewardModal();
          }, 950);

        } else {
          playSFX('wrong');
          clickedSpotContainer.classList.add('wrong');
          setTimeout(() => {
            clickedSpotContainer.classList.remove('wrong', 'peek');
            isTransitioning = false;
          }, 1200);
        }
      }, 400);
    }

    function showRewardModal() {
      const modal = document.getElementById('rewardPanel');
      const title = document.getElementById('rewardTitle');
      const sub = document.getElementById('rewardSub');
      const btn = document.getElementById('rewardBtn');

      if (currentRound === 3 && currentLevel === 1) {
        title.textContent = "🎉 Level 1 ပြီးမြောက်ပါပြီ! 🎉";
        sub.textContent = "နောက်တစ်ဆင့် Level 2 သို့ တက်လှမ်းပါမည်။";
        btn.textContent = "Level 2 သို့သွားမည်";
      } else if (currentRound === 6 && currentLevel === 2) {
        title.textContent = "🚀 Level 2 ပြီးမြောက်ပါပြီ! 🚀";
        sub.textContent = "နောက်ဆုံးအဆင့် Level 3 သို့ တက်လှမ်းပါမည်။";
        btn.textContent = "Level 3 သို့သွားမည်";
      } else if (currentRound === 9) {
        title.textContent = "🏆 ဂုဏ်ယူပါတယ်! သင်ခန်းစာ ပြီးဆုံးပါပြီ 🏆";
        sub.textContent = "အာကာသထဲက အက္ခရာများအားလုံးကို အောင်မြင်စွာ ရှာဖွေပြီးပါပြီ။";
        btn.textContent = "ပင်မမြေပုံသို့ ပြန်သွားမည်";
      } else {
        title.textContent = "🎉 အောင်မြင်စွာ ရှာဖွေနိုင်ခဲ့ပါပြီ! 🎉";
        sub.textContent = "သူငယ်ချင်းလေးဆီက ရှာတွေ့လိုက်တဲ့ အက္ခရာကတော့ -";
        btn.textContent = "နောက်ထပ် အက္ခရာအသစ် ရှာမည်";
      }

      modal.classList.add('show');
    }

    function advanceToNextRound() {
      document.getElementById('rewardPanel').classList.remove('show');
      
      if (currentRound === 3 && currentLevel === 1) {
        currentLevel = 2;
      } else if (currentRound === 6 && currentLevel === 2) {
        currentLevel = 3;
      } else if (currentRound >= 9) {
        window.location.href = "index.html?fromGame=true&showPopup=stage7";
        return;
      }
      
      setupNewTargetRound();
    }
  </script>
</body>
</html>
